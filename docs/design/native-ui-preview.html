function runOnce(ref){if(!refName(ref))return;state.lastRunRequest={...ref,mode:'once',configRevision:state.configRevision};if(!['待机','已停止'].includes(state.run)){state.lastRunRequest.status='blocked';state.busyRequest={...ref};render();return}state.lastRunRequest.status='started';state.busyRequest=null;state.currentRef={...ref};state.runOrigin='立即执行 · 仅本次';state.run='运行中';state.more=false;state.sheet=false;render();notify(`模拟开始：${refName(ref)}，仅执行一次，周期计划开关不变`)}
function pauseCurrent(ref=null){if(ref&&!isCurrentRef(ref)){notify('该快捷项不是当前运行项，未暂停其他任务');return}if(['待机','已停止','暂停中','恢复中','停止中'].includes(state.run))return;const next=state.run==='已暂停'?'运行中':'已暂停';state.run=next==='运行中'?'恢复中':'暂停中';state.busyRequest=null;render();setTimeout(()=>{if(['暂停中','恢复中'].includes(state.run)){state.run=next;render()}},650)}
function stopCurrent(){state.run='停止中';state.busyRequest=null;state.more=false;state.sheet=false;render();setTimeout(()=>{if(state.run==='停止中'){state.run='已停止';state.currentRef=null;render();notify('模拟：当前运行已结束。可再次点执行一次；未自动排队。')}},650)}
function execRow(ref,detail=true){const name=refName(ref),sub=ref.kind==='plan'?planDefs[ref.id].summary:taskDefs[ref.id].summary;return `<div class="native-row execution-row"><button class="execution-main" data-open-ref ${refAttrs(ref)}><span class="row-icon">${icon(ref.kind==='plan'?'plans':(categoryDefs[taskDefs[ref.id].category]?.[1]||'tasks'))}</span><span class="row-text"><span class="row-title">${name}</span><span class="row-sub">${sub}</span></span></button><button class="iconbtn execute-once" aria-label="立即执行${name}一次" title="执行一次" data-run-once ${refAttrs(ref)}>${icon('play')}</button></div>`}
function quickRows(){return commonRefs().length?commonRefs().map(ref=>`<div class="quick-row"><button class="quick-name" data-open-ref ${refAttrs(ref)}><span class="quick-kind">${ref.kind==='plan'?'计划':'任务'}</span><span>${refName(ref)}</span></button><button class="quick-action" aria-label="${isCurrentRef(ref)?pauseLabel():'执行一次'}：${refName(ref)}" ${isCurrentRef(ref)?'data-pause-ref':'data-run-once'} ${refAttrs(ref)}>${icon(isCurrentRef(ref)?pauseIcon():'play')}</button></div>`).join(''):`<p class="quick-empty">没有常用项目，请在任务或计划中开启“常用”</p>`}
function quickPanel(){return `<div class="quick-panel"><div class="quick-heading"><span>常用执行</span><button class="iconbtn" aria-label="收起快捷列表" data-action="quick-close">${icon('close')}</button></div>${quickRows()}</div>`}
const issueQuickLabel=()=>state.issueKind==='auth'?'模型认证失败 · 改密钥':state.issueKind==='resource'?'资源不足 · 改目标':'兑换结果未知 · 查看原因';
const issueQuickAttrs=()=>state.issueKind==='unknown'?'data-issue-kind="unknown"':`data-action="fix-issue" data-fix-issue-kind="${state.issueKind}"`;
const originalAppBody=appBody;
appBody=function(page){switch(page){
case 'home':{const raw=originalAppBody(page);return raw.replace('每日物资领取</p>',`${state.currentRef?refName(state.currentRef):'尚无运行任务'}</p>`).replace('本地模式 · 设备已就绪',`${state.runOrigin} · 设备已就绪`).replace('商店兑换结果待核对','商店兑换结果未知').replace('data-page="issue"','data-issue-kind="unknown"')}
case 'tasks':return `<div class="flat-list">${Object.entries(categoryDefs).map(([id,[name,ico]])=>`<button class="native-row" data-category="${id}"><span class="row-icon">${icon(ico)}</span><span class="row-text"><span class="row-title">${name}</span><span class="row-sub" style="display:block">查看规则或执行一次</span></span><span class="chevron">${icon('chevron')}</span></button>${divider()}`).join('')}</div>`;
case 'daily':return `<div class="section-label">${categoryDefs[state.category][0]}</div><div class="flat-list">${Object.entries(taskDefs).filter(([,t])=>t.category===state.category).map(([id])=>execRow({kind:'task',id})).join(divider())}</div><p class="support">右侧按钮仅执行一次；详情中的“常用”开关控制悬浮显示。</p>`;
case 'plans':return `<div class="section-label">计划</div><div class="flat-list">${Object.keys(planDefs).map(id=>`<div>${execRow({kind:'plan',id})}<div class="plan-enable-summary">周期计划：${planDefs[id].enabled?'已启用':'未启用'}</div></div>`).join(divider())}</div><div class="section-label">当前运行</div><div class="flat-list">${state.currentRef?row('play',refName(state.currentRef),state.runOrigin,'home',state.run):row('plans','当前待机','可以立即执行一项任务或一轮计划','tasks')}</div>`;
case 'task-detail':{const ref={kind:'task',id:state.selectedTaskId},t=taskDefs[ref.id];return `<div class="detail-summary"><h3>${t.name}</h3><p>${t.summary}</p></div><div class="flat-list">${row('tasks','任务规则',`使用同一份已保存规则 · 版本 ${state.configRevision}`,'task-settings')}${divider()}${row('soul','资源影响',t.impact,'task-settings')}</div>${commonToggle(ref)}`}
case 'plan-detail':{const ref={kind:'plan',id:state.selectedPlanId},p=planDefs[ref.id];return `<div class="detail-summary"><h3>${p.name}</h3><p>${p.summary}</p></div><div class="native-row settings-row"><span class="row-text"><span class="row-title">周期计划</span><span class="row-sub" style="display:block">${p.enabled?'已启用':'未启用'} · 执行一轮不会改变开关</span></span><button class="switch ${p.enabled?'on':''}" role="switch" aria-checked="${p.enabled}" aria-label="启用周期计划" data-plan-enable="${ref.id}"></button></div><div class="section-label">引用任务</div><div class="flat-list">${p.taskIds.map(id=>execRow({kind:'task',id})).join(divider())}</div>${commonToggle(ref)}`}
case 'task-settings':{const t=taskDefs[state.selectedTaskId];return `<div class="form-area"><h3 class="form-context-title">${t.name}</h3>${t.rules.map(label=>`<label class="outlined-field"><span>${label}</span><input data-rule-field="${escapeAttr(label)}" placeholder="按你的目标设置" value="${escapeAttr(state.rules[state.selectedTaskId]?.[label]||'')}"></label>`).join('')}</div><p class="support">修改目标或预算不会购买资源，也不会自动重做之前的操作。</p>`}
case 'settings':return originalAppBody(page);
case 'model':return modelBody();
case 'messages':return `<div class="native-tabs">${['待处理','通知记录','运行历史'].map(t=>`<button class="${state.messageTab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="flat-list">${state.messageTab==='待处理'?issueEntry('auth','模型密钥认证失败','更新密钥后重新验证')+divider()+issueEntry('resource','御魂副本资源不足','可修改目标次数或预算')+divider()+issueEntry('unknown','商店兑换结果未知','配置不能确认之前是否已消费'):state.messageTab==='通知记录'?row('messages','兑换结果未知','渠道已接收 · 问题仍未解决','issue','已接收'):row('check','永久勾玉卡产出领取','已核对实际领取状态','home','完成')}</div>`;
case 'issue':return issueBody();
default:return originalAppBody(page)}};
function issueEntry(kind,title,sub){return `<div class="native-row execution-row"><button class="execution-main" data-issue-kind="${kind}"><span class="row-icon">${icon('warn')}</span><span class="row-text"><span class="row-title">${title}</span><span class="row-sub">${sub}</span></span></button>${kind==='unknown'?'<button class="text-button" data-issue-kind="unknown">查看原因</button>':`<button class="text-button" data-action="fix-issue" data-fix-issue-kind="${kind}">${kind==='auth'?'改密钥':'改目标'}</button>`}</div>`}

function modelBody(){const p=state.provider==='custom'?{...modelPresets.custom,base:state.customBase||'',model:state.customModel||''}:modelPresets[state.provider];return `<div class="flat-list"><div class="native-row settings-row"><span class="row-text"><span class="row-title">云端视觉模型</span><span class="row-sub" style="display:block">关闭后仍可使用已适配本地任务</span></span><button class="switch ${state.model?'on':''}" role="switch" aria-checked="${state.model}" aria-label="启用云端视觉模型" data-action="model"></button></div></div><div class="form-area"><label class="outlined-field native-select"><span>模型服务</span><select id="model-provider">${Object.entries(modelPresets).map(([id,p])=>`<option value="${id}" ${state.provider===id?'selected':''}>${p.name}${id==='qwen'?' · 中国站北京':''}</option>`).join('')}</select></label><label class="outlined-field"><span>API Key</span><input type="password" id="model-key" placeholder="粘贴 API Key" value="${escapeAttr(modelKeyDraft)}" autocomplete="off"></label><div class="key-help-row"><button class="text-button" data-action="key-guide">如何获取密钥 ${icon('chevron')}</button></div>${state.provider==='qwen'?'<p class="field-helper">使用中国站北京的按量付费 API Key，地域与密钥需匹配。</p>':''}${state.keyGuide?`<div class="key-guide"><h3>${p.name} 密钥获取</h3><ol>${p.guide.map(x=>`<li>${x}</li>`).join('')}</ol>${p.keyUrl?`<a class="key-external" href="${p.keyUrl}" target="_blank" rel="noopener noreferrer">打开官方密钥管理页 ↗</a>`:''}</div>`:''}<button class="advanced-toggle" data-action="advanced">高级设置<span>${state.advanced||state.provider==='custom'?'收起':'服务地址与模型已预设'}</span>${icon('chevron')}</button>${state.advanced||state.provider==='custom'?`<div class="advanced-fields"><label class="outlined-field"><span>服务地址</span><input type="url" value="${escapeAttr(p.base)}" placeholder="填写服务地址" ${state.provider==='custom'?'data-custom-base':'readonly'}></label><label class="outlined-field"><span>模型标识</span><input value="${escapeAttr(p.model)}" placeholder="填写视觉模型标识" ${state.provider==='custom'?'data-custom-model':'readonly'}></label><p class="field-helper">${p.modelLabel} · ${p.sub}。预设不自动切换模型。</p></div>`:''}</div>`}
function issueBody(){if(state.issueKind==='auth')return `<div class="issue-body"><h3>模型密钥认证失败</h3><p>当前服务拒绝了认证。请检查密钥是否有效，以及服务、账号和地域是否匹配。</p><div class="issue-detail-row"><span>影响</span><strong>依赖云端模型的任务不可用</strong></div><div class="issue-detail-row"><span>下一步</span><strong>修改密钥后验证连接与视觉能力</strong></div><p style="margin-top:17px">更新配置不会自动恢复或重做游戏操作。</p></div>`;if(state.issueKind==='resource')return `<div class="issue-body"><h3>御魂副本资源不足</h3><p>当前资源无法满足已设目标。可以降低目标次数或调整允许的资源预算；助手不会因此自动购买或增加资源。</p><div class="issue-detail-row"><span>受影响任务</span><strong>御魂副本</strong></div><div class="issue-detail-row"><span>可修改</span><strong>目标次数、体力／门票预算</strong></div><p style="margin-top:17px">保存后先检查条件，再由你决定是否重新执行一次。</p></div>`;return `<div class="issue-body"><h3>兑换结果未知</h3><p>商店操作后连接中断，无法确认商品或余额是否变化。修改配置不能判断之前是否已消费，不能用保存配置代替结果核对。</p><div class="issue-detail-row"><span>资源影响</span><strong>可能已消耗，尚未确认</strong></div><div class="issue-detail-row"><span>通知状态</span><strong>渠道已接收，问题未解决</strong></div><p style="margin-top:17px">先检查游戏内商品、限购或余额。你仍可调整该任务后续规则，但不会自动重做这笔兑换。</p></div>`}
const originalAppFooter=appFooter;
appFooter=function(page){if(page==='task-detail'||page==='plan-detail')return `<div class="native-actionbar"><button class="text-button" data-action="back">返回列表</button></div>`;if(page==='task-settings')return `<div class="native-actionbar">${filled('保存任务规则','save-rules')}</div>`;if(page==='issue'){const text=state.issueKind==='auth'?'修改模型密钥':state.issueKind==='resource'?'修改目标与预算':'前往相关任务设置';return `<div class="native-actionbar">${state.issueKind==='unknown'?'<button class="text-button" data-action="check-result">查看核对要点</button>':''}<button class="filled-button" data-action="fix-issue" data-fix-issue-kind="${state.issueKind}">${text}</button></div>`}if(page==='daily')return `<div class="native-actionbar"><button class="text-button" data-action="back">返回分类</button></div>`;return originalAppFooter(page)};
const originalAppDevice=appDevice;
appDevice=function(page=state.page,land=false){return originalAppDevice(page,land)};
overlaySheet=function(){return `<div class="game-sheet-shade" data-action="close-more"><div class="game-sheet quick-sheet" data-sheet-content><div class="sheet-handle"></div><div class="sheet-heading"><h3>${state.currentRef?refName(state.currentRef):'当前待机'}</h3>${ib('close','关闭控制面板','close-more')}</div><div class="sheet-meta">${state.run} · ${state.runOrigin}</div>${state.currentRef?`<button class="native-row" data-pause-ref ${refAttrs(state.currentRef)}><span class="row-icon">${icon(pauseIcon())}</span><span class="row-text"><span class="row-title">${pauseLabel()}</span></span></button>`:''}<div class="quick-section-label">常用执行</div>${quickRows()}<button class="native-row" ${issueQuickAttrs()}><span class="row-icon">${icon('warn')}</span><span class="row-text"><span class="row-title">${issueQuickLabel()}</span></span></button>${state.currentRef?`<button class="native-row danger" data-action="stop"><span class="row-icon">${icon('stop')}</span><span class="row-text"><span class="row-title">停止本次托管</span></span></button>`:''}</div></div>`};
const originalGameDevice=gameDevice;
gameDevice=function(variant=state.variant,land=false,opened=state.open,board=false){let html=originalGameDevice(variant,land,opened,board);html=html.replace('每日物资领取</h3>',`${state.currentRef?refName(state.currentRef):'当前待机'}</h3>`);if(variant==='a'&&opened){html=html.replace('<div class="bar-divider">',`<button aria-label="常用任务与计划" data-action="quick-open">${icon('star')}</button><div class="bar-divider">`);if(state.quickOpen){const index=html.lastIndexOf('</div>');html=html.slice(0,index)+quickPanel()+html.slice(index)}}if(variant==='b'&&opened){if(state.quickOpen){html=html.replace(/<div class="edge-panel">[\s\S]*?<button class="edge-close"/,`<div class="edge-panel quick-edge"><div class="quick-heading"><span>常用执行</span><button class="iconbtn" aria-label="返回当前任务" data-action="quick-close">${icon('back')}</button></div>${quickRows()}<button class="edge-close"`)}else html=html.replace('<button class="edge-issue"',`<button class="edge-favorites" data-action="quick-open">${icon('star')}常用任务与计划 ${icon('chevron')}</button><button class="edge-issue"`)}html=html.replace('aria-label="查看待处理问题" data-page="issue"',`aria-label="${issueQuickLabel()}" ${issueQuickAttrs()}`);html=html.replace(/<button class="edge-issue"[\s\S]*?<\/button>/,`<button class="edge-issue" ${issueQuickAttrs()}>${icon('warn')}${issueQuickLabel()}${icon('chevron')}</button>`);return html};
function busyDialog(){const r=state.busyRequest;if(!r)return '';return `<div class="busy-shade" data-action="dismiss-busy"><div class="busy-dialog" data-busy-content><h3>当前已有运行</h3><p>${state.currentRef?refName(state.currentRef):'当前任务'}：${state.run}。</p><p>尚未开始“${refName(r)}”。${state.run==='已暂停'?'当前运行已暂停，仍保留进度。结束后可重新选择执行一次。':'请先暂停或结束当前运行，再决定如何切换。'}当前不会替换、排队或自动重启。</p><div class="busy-actions"><button class="text-button" data-action="dismiss-busy">返回</button>${state.run==='已暂停'?'':`<button class="text-button" data-action="pause-busy">暂停当前运行</button>`}<button class="text-button danger-text" data-action="stop">结束当前运行</button></div></div></div>`}
const originalRenderControls=renderControls;
renderControls=function(){originalRenderControls();const controls=document.getElementById('controls');const run=controls.querySelector('#run');if(run&&!Array.from(run.options).some(o=>o.value==='待机')){run.insertAdjacentHTML('afterbegin','<option>待机</option>');run.insertAdjacentHTML('beforeend','<option>已停止</option>')}if(run)run.value=state.run;controls.insertAdjacentHTML('beforeend',`<button data-board="interaction">四项交互对照</button><label>异常例<select id="issue-kind"><option value="auth" ${state.issueKind==='auth'?'selected':''}>模型认证失败</option><option value="resource" ${state.issueKind==='resource'?'selected':''}>任务资源不足</option><option value="unknown" ${state.issueKind==='unknown'?'selected':''}>兑换结果未知</option></select></label>`)};
const originalRender=render;
render=function(){const params=new URLSearchParams(location.search);if(params.get('board')==='interaction'){document.body.classList.add('board-mode');renderControls();const land=params.get('orientation')==='landscape',oldIssue=state.issueKind,oldQuick=state.quickOpen;state.issueKind='auth';state.quickOpen=true;document.getElementById('stage').innerHTML=`<div class="board-heading"><h1>04　执行、模型、悬浮快捷与异常修改</h1><p>交互草案，所有数据及操作均为模拟。执行一次、周期启用与收藏分开；忙时不替换当前运行。模型预设来自官方契约核验。</p></div><div class="interaction-board ${land?'land-board':''}"><article><div class="review-art-title">任务行右侧执行一次</div>${appDevice('daily',land)}</article><article><div class="review-art-title">计划行右侧执行一轮</div>${appDevice('plans',land)}</article><article><div class="review-art-title">任务／计划一个“常用”开关</div>${appDevice('task-detail',land)}</article><article><div class="review-art-title">选择预设服务，主要填写 API Key</div>${appDevice('model',land)}</article><article><div class="review-art-title">游戏内常用执行，当前关联项可暂停</div>${gameDevice('b',land,true,true)}</article><article><div class="review-art-title">按错误原因直达相关配置</div>${appDevice('messages',land)}</article></div>${busyDialog()}`;state.issueKind=oldIssue;state.quickOpen=oldQuick;return}originalRender();document.getElementById('stage').insertAdjacentHTML('beforeend',busyDialog())};
const originalGoPage=goPage;
const pageBack=[];
goPage=function(page){if(state.editingIssueRef&&page!=='task-settings')state.editingIssueRef=null;if(page!==state.page)pageBack.push(state.page);originalGoPage(page)};
document.addEventListener('input',e=>{if(e.target.id==='model-key')modelKeyDraft=e.target.value;if(e.target.hasAttribute('data-custom-base'))state.customBase=e.target.value;if(e.target.hasAttribute('data-custom-model'))state.customModel=e.target.value;if(e.target.dataset.ruleField){const id=state.selectedTaskId;state.rules[id]||={};state.rules[id][e.target.dataset.ruleField]=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='model-provider'){state.provider=e.target.value;state.advanced=false;state.keyGuide=false;modelKeyDraft='';render()}if(e.target.id==='issue-kind'){state.issueKind=e.target.value;render()}if(e.target.id==='run'){if(['待机','已停止'].includes(e.target.value)){state.currentRef=null;state.runOrigin='未启动'}else if(!state.currentRef){state.currentRef={kind:'plan',id:'daily-plan'};state.runOrigin='托管计划'}render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const ref={kind:b.dataset.refKind,id:b.dataset.refId};let handled=true;if(b.hasAttribute('data-open-ref'))openRef(ref);else if(b.hasAttribute('data-common-ref'))toggleCommon(ref);else if(b.hasAttribute('data-run-once'))runOnce(ref);else if(b.hasAttribute('data-pause-ref'))pauseCurrent(ref);else if(b.dataset.category){state.category=b.dataset.category;goPage('daily')}else if(b.dataset.planEnable){planDefs[b.dataset.planEnable].enabled=!planDefs[b.dataset.planEnable].enabled;render()}else if(b.dataset.issueKind){state.issueKind=b.dataset.issueKind;goPage('issue')}else switch(b.dataset.action){case 'pause':pauseCurrent();break;case 'stop':stopCurrent();break;case 'pause-busy':pauseCurrent();break;case 'dismiss-busy':state.busyRequest=null;render();break;case 'quick-open':state.quickOpen=true;render();break;case 'quick-close':state.quickOpen=false;render();break;case 'advanced':state.advanced=!state.advanced;render();break;case 'key-guide':state.keyGuide=!state.keyGuide;render();break;case 'fix-issue':state.issueKind=b.dataset.fixIssueKind||state.issueKind;state.editingIssueRef=null;if(state.issueKind==='auth')goPage('model');else{state.selectedTaskId=state.issueKind==='resource'?'soul-dungeon':'shop-exchange';state.editingIssueRef={kind:state.issueKind,taskId:state.selectedTaskId};goPage('task-settings')}break;case 'save-rules':state.configRevision++;notify('模拟：规则已更新，未启动、购买资源或重做之前的操作');if(state.editingIssueRef?.taskId===state.selectedTaskId){state.issueKind=state.editingIssueRef.kind;state.editingIssueRef=null;goPage('issue')}else state.editingIssueRef=null;break;case 'save':notify(state.page==='model'?'演示：不持久保存密钥；请先验证配置，不自动恢复游戏任务':'演示：不持久保存配置');break;case 'test-model':notify('模拟能力验证；真实验证需发起云端请求，可能消耗额度。本原型未调用。');break;case 'back':{state.editingIssueRef=null;const page=pageBack.pop()||'settings';originalGoPage(page);break}default:handled=false}if(handled){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('click',e=>{if(e.target.classList.contains('busy-shade')){state.busyRequest=null;render()}},true);

if(!pageTitles[state.page])state.page='home';
render();window.nativePrototypeApi={state,render,appDevice,gameDevice,pageTitles,goPage,taskDefs,planDefs,modelPresets,runOnce,toggleCommon,isCommon,isCurrentRef,quickRows};
</script>
</body>
