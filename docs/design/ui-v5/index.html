<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阴阳师助手 · 明暗与玻璃按钮</title><script src="appearance.js"></script><link rel="stylesheet" href="theme-tokens.css"><link rel="stylesheet" href="material.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:var(--font-body)/1.65 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px 64px}h1{margin:0;font-size:28px;letter-spacing:-.5px}p{color:var(--muted);max-width:850px}a{color:var(--primary)}.links{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.links a{padding:10px 18px;text-decoration:none;font-weight:500;min-height:48px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;cursor:pointer;color:inherit;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:16px;background:var(--raised)}button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}button:focus-visible,a:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}.pair.landscape{grid-template-columns:1fr}.shot{margin:0;min-width:0}.shot figcaption{font-size:14px;font-weight:600;margin-bottom:10px}.shot img{display:block;width:100%;height:auto;max-width:412px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm)}.pair.landscape img{max-width:900px}.note{padding:12px 16px;background:var(--raised);border-radius:12px;font-size:13px}.foot{font-size:13px;margin-top:28px}@media(max-width:650px){main{padding:20px 14px}.pair{gap:12px}h1{font-size:24px}.links{gap:8px}.links a{padding:9px 13px}button{font-size:13px;padding:8px 12px}}</style></head><body><main><h1>阴阳师助手 · 明暗主题</h1><p>黑白灰作为主体与操作材质，彩色图标为入口增加辨识度；运行蓝、成功绿、警告琥珀、失败红保留功能含义。操作按钮采用透光、柔和反射与内沿高光，正文保持清晰。</p><div class="links"><a class="glass-button" href="app.html">打开主应用</a><a class="glass-button" href="full.html#settings">设置与主题切换</a><a class="glass-button" href="developer.html">开发者流程</a><a class="glass-button is-quiet" href="review-report.md">设计与验收说明</a></div><p class="note">主题默认跟随系统，在设置右上角直接选择“系统／浅色／深色”。以下截图均为本地浏览器实际渲染；游戏、账号、通知、模型及发布为模拟。</p><div class="filters" id="scene"></div><div class="filters"><button data-orientation="portrait" aria-pressed="true">竖屏</button><button data-orientation="landscape" aria-pressed="false">横屏</button></div><div class="pair" id="pair"><figure class="shot"><figcaption>浅色</figcaption><a id="light-link"><img id="light" alt="浅色主题设计截图"></a></figure><figure class="shot"><figcaption>深色</figcaption><a id="dark-link"><img id="dark" alt="深色主题设计截图"></a></figure></div><p class="foot">主应用使用上一轮的队列优先与横屏配置布局；其余完整页面及开发者流程接入同一主题层。实际 Android 材质、性能与系统授权仍需后续实现验证。<a href="main-theme-notes.md">主稿说明</a> · <a href="secondary-theme-notes.md">完整流程说明</a></p></main><script>const scenes={home:'工作台',tasks:'任务中心',config:'任务配置',quick:'快捷悬浮',common:'常用悬浮',settings:'设置',plans:'托管计划',versions:'任务更新',history:'历史记录',model:'视觉模型',channels:'通知渠道',devtask:'任务制作',devdebug:'调试失败',devpublish:'版本发布'};let scene='home',orientation='portrait';document.querySelector('#scene').innerHTML=Object.entries(scenes).map(([id,label])=>`<button data-scene="${id}" aria-pressed="${id===scene}">${label}</button>`).join('');function render(){document.querySelector('#pair').className='pair '+orientation;for(const theme of ['light','dark']){const url=`screen-captures/${scene}-${theme}-${orientation}.png`;document.querySelector('#'+theme).src=url;document.querySelector('#'+theme+'-link').href=url}document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));document.querySelectorAll('[data-orientation]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.orientation===orientation))}document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.scene)scene=b.dataset.scene;if(b?.dataset.orientation)orientation=b.dataset.orientation;if(b)render()});render();</script></body></html>
