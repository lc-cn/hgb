const state={orientation:new URLSearchParams(location.search).get('orientation')==='landscape'?'landscape':'portrait',page:'home',run:'运行中',model:false,noticeTab:'待处理',taskFilter:'全部',ballExpanded:false,modal:null,channel:false,paused:false,gameState:'运行中',ballPos:null};
const goto=id=>`data-go="${id}"`;
const button=(label,action='',primary=false)=>`<button ${action} class="${primary?'primary':''}">${label}</button>`;
const pill=t=>`<span class="chip">${t}</span>`;
const hint=t=>`<div class="hint">${t}</div>`;
const field=(label,placeholder,type='text')=>`<label class="field"><span>${label}</span><input type="${type}" placeholder="${placeholder}" autocomplete="off"></label>`;
const select=(label,items)=>`<label class="field"><span>${label}</span><select>${items.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const row=(title,sub,to,right='›')=>`<button class="item" ${to?goto(to):'data-demo="此项规则待确认；原型不执行游戏操作"'}><div class="grow"><strong>${title}</strong>${sub?`<p>${sub}</p>`:''}</div><span class="${right==='›'?'chevron':'badge'}">${right}</span></button>`;
const section=(t,s='')=>`<div class="section">${t}<span class="muted">${s}</span></div>`;
const toggle=(name,on=false,key='')=>`<div class="row"><span>${name}</span><button class="switch ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${name}" ${key?`data-toggle="${key}"`:'data-local-toggle'}></button></div>`;
const check=(t,checked=false)=>`<label class="rule"><input type="checkbox" ${checked?'checked':''}><span>${t}</span></label>`;
const actions=(a,b,ap='')=>`<div class="btns">${button(a,ap||'data-demo="仅演示交互，不执行真实操作"',true)}${b?button(b,'data-go="plans"'):''}</div>`;

case 'issue':return `<div class="stack"><div class="warning"><strong>!　商店兑换结果未知</strong><p>连接中断后尚未核对游戏结果，不能按“失败”直接重试。</p></div><div class="box stack">${kv('受影响任务','商店兑换 · 示例')}${kv('执行状态','等待核对')}${kv('资源影响','可能已消费，尚未确认')}${kv('通知状态','渠道已接收')}</div><div class="shot">异常发生时截图占位 · 非游戏截图</div>${section('建议处理顺序')}<div class="timeline"><div>检查游戏当前商品、限购或余额</div><div>确认这次操作实际是否完成</div><div>再决定继续、停止或调整规则</div></div><div class="btns">${button('核对当前状态','data-demo="演示核对入口，不连接游戏、不自动重试"',true)}${button('停止本次运行','data-action="stop"')}</div>${button('通知投递详情',goto('delivery'))}</div>`;
case 'delivery':return `<div class="stack"><div class="box stack"><h3>错误通知 · 演示记录</h3>${kv('事件','商店兑换结果未知')}${kv('渠道','自定义渠道 · 示例')}${kv('服务反馈','渠道已接收')}${kv('用户已读','无法据此确认')}${kv('问题处理','仍待核对')}</div><div class="timeline"><div><strong>20:01 · 尝试投递</strong><p class="small muted">时间为示例</p></div><div><strong>20:01 · 渠道已接收</strong><p class="small muted">不代表接收人已经看到</p></div><div><strong>游戏问题仍待处理</strong></div></div><div class="warning">若请求超时，应显示“投递结果未知”；自动重发与重复合并规则待确认。</div>${button('查看关联问题',goto('issue'),true)}${button('管理通知渠道',goto('channels'))}</div>`;
case 'history':return `<div class="stack"><div class="box stack"><div class="row"><h3>物资产出领取</h3>${pill('完成 · 示例')}</div>${kv('任务','永久勾玉卡产出领取')}${kv('执行方式','本地已适配流程')}${kv('完成依据','核对领取后状态')}${kv('奖励数量','以游戏实测记录为准')}${kv('额外购买','本次无购买操作')}</div><div class="shot">结果证据占位</div>${section('执行过程')}<div class="timeline"><div>核对是否拥有领取资格</div><div>识别当前可领取状态</div><div>执行领取并核对结果</div></div>${button('前往任务规则',goto('daily'))}</div>`;
case 'settings':return `<div class="stack"><div class="box soft"><div class="row"><div><h3>当前使用方式</h3><p class="small muted">Android 本地模式 · 演示</p></div>${pill('无云端依赖')}</div></div><div class="list">${row('运行环境','设备、授权与截图／输入能力','environment')}${row('云端视觉模型','可选服务、模型、认证与预算','model')}${row('通知渠道','接收目标、错误告知与投递状态','channels')}${row('悬浮球','显示、尺寸、透明度和快捷控制','float-settings')}${row('主题与兼容','主题、模式与受限能力','compatibility')}${row('运行与数据','恢复规则、记录及截图留存','data-settings')}</div>${hint('任务的商品和御魂规则在任务详情配置，公共设置不重复保存。')}</div>`;
case 'environment':return `<div class="stack">${pill('环境检查 · 模拟结果')}<div class="list">${row('设备环境','Android 真机／模拟器 · 待检测',null,'待检查')}${row('游戏截图能力','需要实际授权与技术验证',null,'未验证')}${row('游戏操作能力','具体实现与授权方式待方案验证',null,'未验证')}${row('悬浮显示能力','拒绝或撤销后需说明影响',null,'未验证')}${row('本机通知能力','独立授权；关闭不一概阻塞游戏任务',null,'未验证')}${row('长期运行条件','系统中断与恢复需实测',null,'未验证')}</div>${button('运行环境检查（模拟）','data-demo="模拟：发现截图与操作能力尚未验证；未请求任何系统权限"',true)}<div class="warning">能安装 APK 不等于可运行全部任务。Root、ADB 或电脑辅助依赖目前未确定。</div>${button('查看兼容范围',goto('compatibility'))}</div>`;
case 'model':return `<div class="stack"><div class="box">${toggle('启用云端视觉模型',state.model,'model')}</div>${field('服务地址','填写兼容的服务地址','url')}${field('模型名称','填写视觉模型标识')}${field('认证密钥','仅占位，不保存任何密钥','password')}${field('调用预算','规则和额度待确认')}<div class="btns">${button('验证视觉能力（模拟）','data-demo="模拟检查：未配置真实服务，本原型不会发起网络请求"')}${button('保存演示配置','data-demo="仅演示，不保存配置或密钥"',true)}</div>${hint('关闭模型仍可运行已验证的本地任务。云端不可用不等于任务已完成。')}<div class="warning">发送截图的范围与费用规则需明确。支持协议待技术方案核验。</div></div>`;
case 'channels':return `<div class="stack">${hint('出错或需要接管时，通过你配置的渠道告知。测试和发送均需明确目标。')}<div class="list">${row('本机通知（候选）','系统授权与可用条件待验证','channel-edit','待配置')}${row('自定义通知渠道','接收目标、认证、事件订阅','channel-edit','待配置')}</div>${button('添加通知渠道',goto('channel-edit'),true)}${section('通知什么')}<div class="box stack">${kv('运行异常','订阅待配置')}${kv('结果未知／需要介入','订阅待配置')}${kv('普通完成与摘要','可选，不自动启用')}</div><div class="warning">如果助手进程本身已停止，本机发送无法保证。外部存活监测不在当前默认范围。</div>${button('查看通知记录',goto('delivery'))}</div>`;
case 'channel-edit':return `<div class="stack">${field('渠道名称','便于辨认的名称')}${select('渠道类型（候选）',['请选择，首批支持范围待定','系统通知','推送服务','机器人 Webhook','邮件'])}${field('接收目标／服务地址','待填写')}${field('认证信息','占位，不保存真实认证','password')}<div class="section">事件订阅</div><div class="box">${check('运行错误')}${check('结果未知／需要接管')}${check('资源或能力受限')}${check('普通结果与摘要（可选）')}</div><div class="warning">重复提醒、合并、静默时段与截图附带规则待确认。</div><div class="btns">${button('测试发送（模拟）','data-action="test-notice"')}${button('保存演示配置','data-demo="未保存真实渠道，不会发送消息"',true)}</div></div>`;
case 'float-settings':return `<div class="stack"><div class="box">${toggle('显示悬浮球',true)}</div><label class="field"><span>球体大小 · 示意</span><input type="range" min="44" max="72" value="56" aria-label="球体大小"></label><label class="field"><span>透明度 · 示意</span><input type="range" min="30" max="100" value="90" aria-label="球体透明度"></label><div class="box stack"><strong>快捷控制</strong><p class="small muted">状态、暂停／继续、停止、异常入口、返回助手</p></div><div class="list">${row('收起状态与拖动','点击展开，拖动更换演示位置','float-game')}${row('展开面板','只放高频控制，不编辑复杂规则','float-expanded')}${row('异常状态','问题与通知投递分开呈现','float-error')}</div>${hint('吸边、自动收起、手势与唤回方式待设计确认；隐藏不等于停止。')}</div>`;
case 'compatibility':return `<div class="stack">${hint('以下均为布局示意，不代表任何真机、模拟器或主题已实测通过。')}<div class="seg"><button class="active" data-demo="本地支持矩阵为占位，等待真实验证">本地模式</button><button data-demo="模型增强支持矩阵需另行验证">模型增强</button></div><div class="list">${row('主题 A · 占位','同一组任务需跨主题验证',null,'待验证')}${row('主题 B · 占位','图标与布局实际不同',null,'待验证')}${row('未专项适配主题','独立评估泛化及未知状态',null,'未适配')}</div><div class="box stack">${kv('安卓真机','版本与设备清单待确定')}${kv('Windows 模拟器','具体产品与版本待验证')}${kv('长期运行','需分别进行 24 小时实测')}</div>${button('查看运行环境',goto('environment'))}</div>`;
case 'data-settings':return `<div class="stack"><div class="list">${row('中断恢复规则','重连、重启、重试与补做均待确认',null,'待确认')}${row('配置生效方式','运行中修改何时生效待定义',null,'待确认')}${row('日志与截图留存','时长、清理与外发范围待确认',null,'待确认')}${row('记录导出','内容和敏感信息处理待定义',null,'待确认')}</div><div class="warning">不会因开启托管而默认增加开机自启、自动更新、消息群发或消费权限。</div>${button('查看运行记录',goto('history'))}</div>`;
default:return gameContent(id);
}}
function gameContent(id){const error=id==='float-error',expanded=id!=='float-game'||state.ballExpanded;return `<div class="world"><span class="pageid">模拟游戏界面 · 非真实游戏截图</span><div class="island">游戏主要内容区域</div><div class="gametools"><span>入口</span><span>任务</span><span>背包</span></div><div class="footnote">悬浮球需验证不遮挡关键内容、不干扰识别与输入。拖动位置仅在本次预览有效。</div></div><div class="crosshair">保留游戏操作空间</div>${expanded?floatPanel(error):`<button class="floatball" aria-label="展开悬浮球" data-action="expand-ball"><strong>${state.gameState==='已暂停'?'Ⅱ':'▷'}</strong><span>${state.gameState}</span></button>`}`;}
function floatPanel(error=false){return `<div class="floatpanel"><div class="row"><strong>阴阳师助手</strong><button class="mini" data-action="collapse-ball">收起</button></div><div class="row" style="margin:10px 0 6px"><span class="small">${error?'!　需要核对结果':state.gameState}</span>${pill(error?'待处理':'本地模式')}</div><p class="small">${error?'商店兑换结果未知':'当前：领取每日物资'}</p><p class="small muted" style="margin-top:5px">${error?'通知：渠道已接收，问题仍未解决':'正在核对领取结果 · 示例进度'}</p><div class="progress"><span style="width:${error?'0':'42'}%"></span></div><div class="btns">${error?button('查看问题',goto('issue'),true):button(state.gameState==='已暂停'?'继续':'暂停','data-action="float-pause"',true)}${button('停止','data-action="stop"')}</div><div class="btns" style="margin-top:8px">${button('返回助手',goto('home'))}${button('临时隐藏','data-action="hide-ball"')}</div></div>`;}
const nav=[['home','工作台'],['tasks','任务中心'],['plans','托管计划'],['messages','消息记录'],['settings','设置']];
function phone(id,board=false,land=false){const m=meta[id],game=id.startsWith('float-')&&id!=='float-settings';const detail=!nav.some(x=>x[0]===id);return `<div class="phone ${land?'landscape-app':''} ${game?'game-device':''}" data-screen="${id}"><div class="statusbar"><strong>09:41</strong><span>◦◦◦　Wi-Fi　▰</span></div><div class="proto-bar">视觉方案草案 · 演示数据 · ${m[0]}</div>${game?'':`<div class="apphead">${detail?`<button class="back" data-back aria-label="返回">‹</button>`:''}<div><div class="pageid">${m[0]} / ${detail?'DETAIL':'MAIN'}</div><h2>${m[1]}</h2></div>${id==='home'?`<button class="trail" ${goto('float-game')}>进入游戏</button>`:''}</div>`}<div class="screen ${game?'game':''}">${content(id)}</div>${game?'':`<nav class="bottomnav" aria-label="主导航">${nav.map(([k,n])=>`<button ${goto(k)} class="${m[2]===k?'selected':''}" ${m[2]===k?'aria-current="page"':''}>${svg(k)}<span>${n}</span></button>`).join('')}</nav>`}${!board&&state.modal?modal():''}</div>`;}
function modal(){const m=state.modal;if(m==='stop')return `<div class="modalshade"><div class="sheet"><h3>停止本次运行？</h3><p>演示停止中与已停止的状态反馈。真实停止时机和确认策略待评审，不将本次弹层视为已确认产品规则。</p><div class="btns">${button('取消','data-action="cancel-modal"')}${button('演示停止','data-action="confirm-stop"',true)}</div></div></div>`;if(m==='notice')return `<div class="modalshade"><div class="sheet"><h3>测试投递结果 · 模拟</h3><p>演示渠道接收结果，不代表用户已读。原型未发起任何真实请求或发送消息。</p>${button('知道了','data-action="cancel-modal"',true)}</div></div></div>`;return `<div class="modalshade"><div class="sheet"><h3>规则预览 · 示例</h3><p>目标与命中结果由实际规则确定。本原型没有读取御魂，也不会强化、标记或消耗任何对象。</p><div class="box dashed small" style="margin-bottom:15px">待配置筛选规则 → 核对对象与影响 → 按授权范围执行</div>${button('返回配置','data-action="cancel-modal"',true)}</div></div></div>`;}
function render(){const params=new URLSearchParams(location.search),board=params.get('board');if(board==='app-landscape'){renderAppLandscape();return}if(board==='landscape'){renderLandscape();return}if(board&&boards[board]){document.body.classList.add('board-mode');document.getElementById('app').innerHTML=`<div class="board-heading"><div class="pageid">YYS ASSIST / VISUAL DRAFT v0.1</div><h1>${boardNames[board]}</h1><p>视觉 UI 草案，沿用原型结构；所有状态、商品、数量和规则均为演示，非真实 Android 实现。</p></div><div class="board">${boards[board].map(id=>`<article><div class="art-title"><span>${meta[id][0]}　${meta[id][1]}</span><span class="pageid">${id}</span></div>${phone(id,true)}<p class="art-note">${meta[id][3]}</p></article>`).join('')}</div>`;return}document.body.classList.remove('board-mode');document.body.classList.toggle('wide-preview',state.orientation==='landscape');document.querySelectorAll('[data-orientation]').forEach(b=>b.classList.toggle('active',b.dataset.orientation===state.orientation));if(params.get('view')==='gallery'){document.getElementById('app').innerHTML=`<div class="board-heading"><h2>视觉方案分组</h2><p>点击组名查看六张页面图，交互预览可逐页操作。</p></div><div class="stack" style="max-width:800px;margin:auto">${Object.keys(boards).map(k=>`<button class="full" data-board="${k}">${boardNames[k]}　→</button>`).join('')}<button class="full" data-board="landscape">06 · 横屏悬浮球与状态　→</button><button class="full" data-board="app-landscape">07 · 主 App 横屏布局　→</button></div>`;return}document.getElementById('app').innerHTML=`<div class="workarea"><aside class="sitemap" aria-label="原型页面目录">${groups.map(([g,ids])=>`<h3>${g}</h3>${ids.map(id=>`<button ${goto(id)} class="${id===state.page?'active':''}"><span class="sid">${meta[id][0]}</span>${meta[id][1]}</button>`).join('')}`).join('')}</aside><div id="interactive-phone">${phone(state.page,false,state.orientation==='landscape')}</div><aside class="notes"><div class="pageid">PAGE ${meta[state.page][0]} · 待确认原型</div><h2>${meta[state.page][1]}</h2><p>${meta[state.page][3]}</p><h3>页面关系</h3><p>${relation(state.page)}</p><h3>交接约束</h3><ul><li>保留信息归属、任务入口和五个主导航。</li><li>同一任务的规则、状态和记录只有一份。</li><li>密钥、数量、时间及阈值均不是产品默认值。</li><li>未适配／未知／失败／完成不可混为一项。</li><li>后续 UI 可优化视觉，不静默增加消费、重试和推送规则。</li></ul><div class="flag small">点击手机内导航、列表与操作查看流程；状态均为内存演示，刷新即重置。悬浮球支持点击与拖动。</div><h3>关联文档</h3><p><a href="../PRD.md">完整产品蓝图</a> · <a href="../prototype/index.html">低保真结构</a> · <a href="ui-design.md">UI 设计说明</a></p></aside></div>`;applyDrag();}
function relation(id){const rel={home:'工作台 → 任务／计划／待处理；“进入游戏” → 悬浮球。',tasks:'任务中心 → 六类业务 → 规则配置 → 单次执行或加入计划。',plans:'托管计划 → 计划编辑 → 引用任务及已有资源规则。',messages:'消息记录 → 问题详情／投递详情／运行结果。',settings:'设置 → 环境／模型／通知／悬浮球／兼容／数据。','shop-detail':'任务中心 → 商店兑换 → 商品规则 → 单次处理／计划。',strengthen:'御魂管理 → 强化规则 → 对象预览 → 授权后执行（未实现）。',sort:'御魂管理 → 整理规则 → 命中预览 → 授权后处理（未实现）。','channel-edit':'设置 → 通知渠道 → 编辑与订阅 → 模拟测试／保存。',issue:'工作台／消息／悬浮球 → 问题详情 → 状态核对与接管。'};return rel[id]||(id.startsWith('float-')?'游戏界面 → 悬浮球 → 展开面板 → 主助手／问题详情。':`所属主入口：${nav.find(x=>x[0]===meta[id][2])[1]}；详情页返回原来源。`);}
function renderAppLandscape(){document.body.classList.add('board-mode');document.getElementById('app').innerHTML=`<div class="board-heading"><div class="pageid">YYS ASSIST / LANDSCAPE UI DRAFT v0.1</div><h1>07 · 主 App 横屏布局</h1><p>从横屏游戏切回助手无需旋转屏幕。侧导航与内容重排，任务、计划和状态与竖屏共用。</p></div><div class="app-land-board">${['home','tasks','plans','messages','settings','channel-edit'].map(id=>`<div class="app-land-row"><div><div class="art-title">${meta[id][0]}　${meta[id][1]} · 横屏</div>${phone(id,true,true)}</div><div class="art-note"><h3>${meta[id][1]}</h3><p>${id==='home'?'当前运行、周期进度和异常、下次执行并列呈现；优先保留控制入口。':id==='tasks'?'六类任务重排为双列，周期和模型标签仍为筛选条件。':id==='plans'?'计划列表与执行目标重排，避免横屏只显示很少内容。':id==='messages'?'消息视图与问题入口保留，同一异常关联通知和运行记录。':id==='settings'?'公共设置双列排列，所有入口与竖屏一致，不复制配置。':'表单采用双列并保持标签与字段关联；复杂内容可滚动，真实UI需固定关键操作。'}</p></div></div>`).join('')}</div>`;}
function renderLandscape(){document.body.classList.add('board-mode');document.getElementById('app').innerHTML=`<div class="board-heading"><div class="pageid">YYS ASSIST / VISUAL DRAFT v0.1</div><h1>06 · 横屏游戏中的悬浮控制</h1><p>游戏背景为示意网格。位置、尺寸、手势及自动展开规则均需实测和确认。</p></div>${[['运行中 · 展开','run'],['结果未知 · 异常','error'],['授权不可用 · 接管入口','permission']].map(([label,k])=>`<div class="landrow"><div><div class="art-title">${label}</div><div class="landscape"><div class="world"><span>游戏信息区</span><span>操作区域</span><span>任务入口</span></div>${k==='permission'?`<div class="floatpanel" style="border-style:dashed"><div class="chip dark">回退说明图 · 非游戏上的真实悬浮层</div><h3 style="margin-top:8px">悬浮显示能力不可用</h3><p class="small muted" style="margin:10px 0">主助手仍应显示授权影响与可用控制入口；本图是异常状态说明，不承诺权限撤销后还能显示悬浮层。</p><button ${goto('environment')}>返回环境检查</button></div>`:floatPanel(k==='error')}</div></div><div class="aside"><h3>${label}</h3><p>${k==='run'?'展开后显示当前任务和状态，暂停／继续与停止分开。球体位置不能干扰游戏识别与点击。':k==='error'?'需要人工核对的内容可见，通知已接收不代表问题已解决；是否自动展开需确认。':'权限丢失后如何回到主助手、如何反馈状态，由技术与 UI 共同验证。不可绘制成仍然具备权限。'}</p></div></div>`).join('')}`;}
const history=[];function navigate(id){if(!meta[id])return;history.push(state.page);state.page=id;state.modal=null;state.ballExpanded=id==='float-expanded'||id==='float-error';const u=new URL(location.href);u.search=state.orientation==='landscape'?'?orientation=landscape':'';u.hash=id;window.history.replaceState({},'',u);render()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),3600)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.dataset.dragged)return;if(b.dataset.orientation){state.orientation=b.dataset.orientation;navigate(state.page);return}if(b.dataset.go){navigate(b.dataset.go);return}if(b.hasAttribute('data-back')){state.page=history.pop()||meta[state.page][2];state.modal=null;const u=new URL(location.href);u.hash=state.page;window.history.replaceState({},'',u);render();return}if(b.dataset.demo){toast(b.dataset.demo);return}if(b.dataset.board){location.search='?board='+b.dataset.board;return}if(b.dataset.filter){state.taskFilter=b.dataset.filter;render();return}if(b.dataset.noticeTab){state.noticeTab=b.dataset.noticeTab;render();return}if(b.dataset.toggle==='model'){state.model=!state.model;render();return}if(b.hasAttribute('data-local-toggle')){const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));b.classList.toggle('on',on);toast('仅切换本次演示，不启用后台任务或通知');return}switch(b.dataset.action){case 'pause':case 'float-pause':{const next=state.run==='已暂停'?'运行中':'已暂停';state.run=next==='已暂停'?'暂停中':'恢复中';state.gameState=state.run;render();setTimeout(()=>{if(['暂停中','恢复中'].includes(state.run)){state.run=next;state.gameState=next;render();toast('演示：控制已确认生效')}},650);break;}case 'stop':state.modal='stop';render();break;case 'confirm-stop':state.run='停止中';state.gameState='停止中';state.modal=null;render();setTimeout(()=>{state.run='已停止';state.gameState='已停止';render();toast('演示：停止已生效，没有实际游戏操作')},650);break;case 'cancel-modal':state.modal=null;render();break;case 'test-notice':state.modal='notice';render();break;case 'soul-preview':state.modal='soul';render();break;case 'expand-ball':state.ballExpanded=true;render();break;case 'collapse-ball':state.ballExpanded=false;if(state.page!=='float-game')navigate('float-game');else render();break;case 'hide-ball':state.ballExpanded=false;render();document.querySelector('.floatball')?.classList.add('hidden');toast('球体已临时隐藏，任务状态不变；通过左侧目录可再次唤出');break}});
function applyDrag(){const ball=document.querySelector('#interactive-phone .floatball');if(!ball)return;const area=ball.parentElement;if(state.ballPos){ball.style.left=state.ballPos.x+'px';ball.style.top=state.ballPos.y+'px';ball.style.right='auto'}let drag=null;ball.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,left:ball.offsetLeft,top:ball.offsetTop,moved:false};ball.setPointerCapture(e.pointerId)});ball.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(!drag.moved)return;const x=Math.max(0,Math.min(area.clientWidth-ball.offsetWidth,drag.left+dx)),y=Math.max(0,Math.min(area.clientHeight-ball.offsetHeight,drag.top+dy));ball.style.left=x+'px';ball.style.top=y+'px';ball.style.right='auto';state.ballPos={x,y}});ball.addEventListener('pointerup',()=>{if(drag?.moved){ball.dataset.dragged='true';setTimeout(()=>delete ball.dataset.dragged,80)}drag=null});ball.addEventListener('pointercancel',()=>{drag=null})}
document.getElementById('preview-mode').onclick=()=>navigate(state.page);document.getElementById('gallery-mode').onclick=()=>{location.search='?view=gallery'};

const visualIcons={daily:visualIcon('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-11 5 2 2 4-4"/>'),shops:visualIcon('<path d="M4 9h16l-1.5-5h-13L4 9zm1 0v11h14V9M9 20v-6h6v6"/><path d="M4 9c0 3 4 3 4 0 0 3 4 3 4 0 0 3 4 3 4 0 0 3 4 3 4 0"/>'),dungeons:visualIcon('<path d="m12 3 8 4v6c0 4-5 7-8 9-3-2-8-5-8-9V7z"/><path d="m9 10 6 6m0-6-6 6"/>'),souls:visualIcon('<path d="m12 3 8 5v9l-8 4-8-4V8zM4 8l8 5 8-5m-8 5v8"/>'),guild:visualIcon('<path d="m3 11 9-7 9 7M5 10v10h14V10M9 20v-7h6v7"/><path d="M2 20h20"/>'),activities:visualIcon('<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>'),strengthen:visualIcon('<path d="m12 3 8 5v9l-8 4-8-4V8zM4 8l8 5 8-5"/><path d="M12 10v7m-3-3.5h6"/>'),sort:visualIcon('<path d="M4 6h16M7 3v6m10-6v6M4 14h16M7 11v6m10-6v6M4 21h16"/>')};
const baseContent=content;
content=function(id){
if(id==='home')return `<div class="stack"><div class="ui-minihead"><span class="ui-seal">阴</span><div><div class="ui-eyebrow">阴阳师助手</div><p class="small muted">设备已就绪 · 演示环境</p></div></div><div class="ui-run"><div class="row"><span class="small">● 当前托管</span>${pill(state.run)}</div><h3>领取每日物资</h3><p class="small" style="margin-top:6px">正在核对永久勾玉卡领取结果</p><div class="progress"><span></span></div><div class="row small"><span>本轮 3 / 7 项 · 示例</span><button class="inline-link" ${goto('plans')}>查看计划 →</button></div><div class="btns">${button(['暂停中','恢复中','停止中','已停止'].includes(state.run)?state.run:(state.run==='已暂停'?'继续运行':'暂停运行'),'data-action="pause"',true)}${button('停止','data-action="stop"')}</div></div><div class="warning"><div class="row"><strong>!　1 项需要处理</strong><button class="inline-link" ${goto('issue')}>去核对 →</button></div><p style="margin-top:5px">商店兑换结果未知，需核对游戏状态</p></div>${section('接下来','时间仅为示例')}<div class="list">${row('周三商店兑换','周三 20:00 · 按已保存商品规则','shop-detail')}${row('御魂整理','等待当前领取任务结束','sort')}</div><div class="metricgrid"><div class="ui-stat"><div class="label">今日已完成 · 示例</div><span class="value">3</span><span class="subvalue">/ 7 项</span></div><div class="ui-stat"><div class="label">本周已完成 · 示例</div><span class="value">1</span><span class="subvalue">/ 4 项</span></div></div></div>`;
if(id==='tasks'){const categories=[['日常与领取','签到、物资、勾玉卡产出','daily'],['商店兑换','商品规则与周期商店','shops'],['副本与挑战','御魂、觉醒、探索、御灵','dungeons'],['御魂管理','强化、整理与保留规则','souls'],['结界与阴阳寮','收取、挂卡与突破','guild'],['限时活动','已适配与新活动理解','activities']];return `<div class="stack"><div class="ui-subline"><span>按业务选择任务</span><span>本地能力 · 待验证</span></div><div class="tagrow">${['全部','每日','每周','需模型'].map(x=>`<button style="min-height:32px;padding:5px 12px;font-size:11px;border-radius:8px" data-filter="${x}" class="${state.taskFilter===x?'primary':''}">${x}</button>`).join('')}</div><div class="ui-taskgrid">${categories.map(([t,d,k])=>`<button class="ui-tasktile" ${goto(k)}><span class="tile-icon">${visualIcons[k]}</span><div><strong>${t}</strong><p>${d}</p></div></button>`).join('')}</div>${hint('每日／每周为筛选标签，同一任务只保留一份规则。当前仅演示选择状态。')}</div>`}
if(id==='souls')return `<div class="stack"><div class="ui-soulintro"><div class="ui-eyebrow">御魂管理</div><h3>御魂强化与整理</h3><p>这里管理已有御魂。强化与整理分别设置，<br>共享筛选和保留条件。</p></div><button class="ui-soulrow" ${goto('strengthen')}><span class="tile-icon">${visualIcons.strengthen}</span><div class="grow"><strong>御魂强化</strong><p>目标阶段 · 素材范围 · 预算</p></div><span class="chevron">›</span></button><button class="ui-soulrow" ${goto('sort')}><span class="tile-icon">${visualIcons.sort}</span><div class="grow"><strong>御魂整理</strong><p>筛选条件 · 保留规则 · 具体操作</p></div><span class="chevron">›</span></button>${section('执行前检查')}<div class="box stack">${kv('强化规则','待配置')}${kv('整理规则','待配置')}${kv('消耗性操作','授权范围待确认')}</div>${button('查看处理记录',goto('history'))}${hint('锁定、装备中、强化中的御魂如何保护，需要在规则中明确。')}</div>`;
const raw=baseContent(id);if(['channel-edit','model','shop-detail','dungeon-detail','strengthen','sort','plan-edit'].includes(id)){const body=document.createElement('div');body.innerHTML=raw;const groups=body.querySelectorAll('.btns');if(groups.length)groups[groups.length-1].remove();return body.innerHTML}return raw;
};

case 'sort':return actions('预览命中对象','','data-action="soul-preview"');
