<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阴阳师助手 · 开发者制作与调试 UI v3</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="developer.css"></head><body><main class="dev-review"><header class="dev-review-heading"><div><p class="dev-eyebrow">UI v3 / 开发者流程</p><h1>制作任务，直接在 App 里试跑</h1><p>本地设计模拟 · GitHub 授权、画面、调试和上传均为内存夹具，无真实网络与游戏操作。</p></div><a href="app.html#settings">返回主 App 设计</a></header><div id="review-controls" class="dev-review-controls" aria-label="画面外评审工具"></div><div class="dev-stage stage"><div id="app-root"></div><aside class="dev-review-notes"><h2>制作与调试</h2><p>任务由步骤和配置 schema 组成；动作由 App 提供。这里以领取类任务演示表单编排，示例不是已验证的游戏流程。</p><p>画面外切换 GitHub 身份可查看有权限、只读与网络未知的区别。产品内没有强制授权开关。</p><p>横屏将列表与当前编辑／调试内容分区，竖屏保留自然阅读和返回关系。</p><p>仓库名和示例资源均为评审夹具，不代表已绑定真实 GitHub 仓库。</p><div id="review-page-list"></div></aside></div></main><div id="toast" class="toast hidden" role="status"></div><script src="developer.js"></script></body></html>
