<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阴阳师助手 · UI v3 评审入口</title><link rel="stylesheet" href="tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px 64px}h1{font-size:30px;margin:0}h2{font-size:20px;margin:32px 0 12px}p{color:var(--muted);max-width:780px}a{color:var(--primary)}.links{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.links a{display:inline-block;background:var(--tonal);border-radius:12px;padding:12px 20px;text-decoration:none;font-weight:600}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 16px;color:var(--ink);font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--tonal);border-color:var(--primary)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}.frame{margin:0;min-width:0}.frame a{display:block}.frame img{width:100%;height:350px;object-fit:contain;object-position:top;background:var(--raised);border:1px solid var(--line);border-radius:16px}.frame.land img{height:auto;aspect-ratio:900/412}.frame.land{grid-column:1/-1;max-width:920px}.frame figcaption{padding:8px 2px;color:var(--muted);font-size:13px}.state{padding:12px 16px;background:var(--raised);border-radius:12px}#gallery:empty:after{content:'截图索引由实际浏览器验收生成。'}[hidden]{display:none!important}@media(max-width:600px){main{padding:24px 16px}.grid{grid-template-columns:1fr 1fr;gap:12px}.frame img{height:280px}h1{font-size:26px}}
</style><main><h1>阴阳师助手</h1><p>UI v3 · Android App 设计评审。主应用与开发者工具使用同一套视觉基线；支持竖屏、横屏和三层悬浮控制。</p><div class="links"><a href="app.html">打开主 App</a><a href="developer.html">打开开发者工具</a><a href="acceptance-report.md">查看质量验收</a></div><p class="state">本地可点击设计模拟。游戏操作、账号快照、云端识别、通知及 GitHub 授权／发布均未连接真实服务。设备框外的控件用于切换评审状态。</p><h2>浏览器渲染截图</h2><p>以下为浏览器实际渲染导出；点击图片查看原尺寸。按模块和方向筛选。</p><div class="filters" id="group"><button aria-pressed="true" data-group="all">全部</button><button aria-pressed="false" data-group="main">主应用</button><button aria-pressed="false" data-group="overlay">悬浮控制</button><button aria-pressed="false" data-group="developer">开发者工具</button></div><div class="filters" id="orientation"><button aria-pressed="true" data-orientation="all">双方向</button><button aria-pressed="false" data-orientation="portrait">竖屏</button><button aria-pressed="false" data-orientation="landscape">横屏</button></div><div class="grid" id="gallery"></div><h2>需求与交接</h2><p><a href="../../PRD.md">最新 PRD</a> · <a href="../system-architecture.md">系统架构</a> · <a href="../app-v2-design.md">交互约定</a> · <a href="quality-checklist.md">独立验收清单</a> · <a href="main-design-notes.md">主 App 说明</a> · <a href="developer-design-notes.md">开发者工具说明</a></p></main><script src="gallery-data.js"></script><script>let group='all',orientation='all';const records=window.uiV3Gallery||[];const root=document.querySelector('#gallery');const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');function render(){root.innerHTML=records.filter(r=>(group==='all'||r.group===group)&&(orientation==='all'||r.orientation===orientation)).map(r=>`<figure class="frame ${r.orientation==='landscape'?'land':''}"><a href="${escape(r.path)}"><img loading="lazy" src="${escape(r.path)}" alt="${escape(r.title)} · ${r.orientation==='landscape'?'横屏':'竖屏'}"></a><figcaption>${escape(r.title)} · ${r.orientation==='landscape'?'横屏':'竖屏'}</figcaption></figure>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.group){group=b.dataset.group;document.querySelectorAll('[data-group]').forEach(x=>x.setAttribute('aria-pressed',x===b))}if(b.dataset.orientation){orientation=b.dataset.orientation;document.querySelectorAll('[data-orientation]').forEach(x=>x.setAttribute('aria-pressed',x===b))}render()});render();</script></html>
