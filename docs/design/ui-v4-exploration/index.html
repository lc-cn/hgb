<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阴阳师助手 · UX 新旧对照</title><style>:root{--bg:#f8f8f3;--ink:#243129;--muted:#6b776e;--line:#dfe4da;--selected:#e2ecdf;--primary:#426b56}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:28px 24px 60px}h1{margin:0;font-size:28px;font-weight:650}p{color:var(--muted);margin:10px 0 18px}a{color:var(--primary)}.links{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;min-height:44px;padding:9px 16px;border:1px solid var(--line);border-radius:24px;color:var(--ink);background:transparent;cursor:pointer}button[aria-pressed=true]{background:var(--selected);border-color:var(--primary)}button:focus-visible,a:focus-visible{outline:3px solid var(--primary);outline-offset:3px}.summary{padding:14px 18px;background:#eeefe8;border-radius:14px;margin:22px 0;color:var(--ink)}.summary p{margin:4px 0;color:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.pair.landscape{grid-template-columns:1fr}.shot{margin:0;min-width:0}.shot h2{font-size:17px;margin:0 0 12px}.shot img{display:block;width:100%;max-width:412px;height:auto;border-radius:18px;border:1px solid var(--line)}.landscape .shot img{max-width:900px}.shot figcaption{max-width:480px;font-size:13px;margin-top:12px;color:var(--muted)}.footnote{font-size:13px;margin-top:32px;max-width:850px}@media(max-width:650px){main{padding:20px 14px}.pair{gap:12px}.shot h2{font-size:15px}.shot figcaption{font-size:12px}.filters{gap:6px}button{font-size:14px;padding:8px 12px}.pair.landscape{gap:28px}}@media(prefers-reduced-motion:no-preference){button{transition:background-color .15s}}</style></head><body><main><h1>同一场景，重新组织操作</h1><p>UX 探索稿 · 沿用同一配色，比较信息层级、操作位置和游戏遮挡。以下布局提案尚待评审。</p><div class="links"><a href="app.html">体验新布局</a><a href="../ui-v3/app.html">打开上一稿</a><a href="review-notes.md">查看设计取舍</a></div><div class="filters" id="scene"></div><div class="filters" id="orientation"><button data-orientation="portrait" aria-pressed="true">竖屏</button><button data-orientation="landscape" aria-pressed="false">横屏</button></div><div class="summary" id="summary"></div><div class="pair" id="pair"><figure class="shot"><h2>上一稿 · v3</h2><a id="before-link"><img id="before" alt="上一稿同场景截图"></a><figcaption id="before-note"></figcaption></figure><figure class="shot"><h2>新布局 · UX 探索</h2><a id="after-link"><img id="after" alt="新布局同场景截图"></a><figcaption id="after-note"></figcaption></figure></div><p class="footnote">两侧使用同一账号、当前计划与任务、等待项和方向。当前／等待状态由本地夹具提供，无真实游戏或服务操作。静态对照可以比较布局；触控舒适度、找到入口的耗时和误触率仍需要实际使用验证。</p></main><script>const scenes={workbench:{label:'工作台',goal:'先看下一项，再就近接管当前执行。',before:'当前执行、计划摘要和结果分段堆叠；运行控制在上方内容区。',after:'队列成为主体；唯一执行控制固定在底部；横屏用窄导航释放纵向空间。'},tasks:{label:'任务列表',goal:'先找到任务，清楚知道按下后是加入队列。',before:'多行分类与周期控件叠在任务前方；圆形播放按钮表达立即运行。',after:'一行类别导航；减少重复装饰；行尾直接表达入队、队列中或暂停。'},detail:{label:'横屏调配置',goal:'改同类任务时，保留列表上下文。',before:'任务配置占据独立页面，需要返回列表再选另一项。',after:'横屏列表与配置同屏；竖屏仍进入完整配置页。列表可见项减少，换取更少往返。'},quick:{label:'快捷悬浮',goal:'从小球打开后，直接接管当前任务。',before:'品牌、当前执行、常用、异常、返回助手各占一行，整体像缩小的菜单页。',after:'当前任务与控制为主组，常用和返回助手为工具组；保持球、快捷、常用三个层级。'},common:{label:'常用悬浮',goal:'快速选择常用项，同时保留更多游戏画面。',before:'每行反复标注任务或计划，行高和面板宽度占用游戏空间。',after:'候选单行名称与行尾控制；唯一当前控制固定，只有候选列表滚动。'}};let scene='workbench',orientation='portrait';document.querySelector('#scene').innerHTML=Object.entries(scenes).map(([k,s])=>`<button data-scene="${k}" aria-pressed="${k===scene}">${s.label}</button>`).join('');function render(){const s=scenes[scene];document.querySelector('#summary').textContent=s.goal;document.querySelector('#before-note').textContent=s.before;document.querySelector('#after-note').textContent=s.after;document.querySelector('#pair').className='pair '+orientation;for(const side of ['before','after']){const path=`screens/${side}-${scene}-${orientation}.png`;document.getElementById(side).src=path;document.getElementById(side+'-link').href=path}document.querySelectorAll('[data-scene]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.scene===scene));document.querySelectorAll('[data-orientation]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.orientation===orientation))}document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.scene)scene=b.dataset.scene;if(b?.dataset.orientation)orientation=b.dataset.orientation;if(b)render()});render();</script></body></html>
