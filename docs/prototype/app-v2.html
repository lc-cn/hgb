function updateFieldValidation(el){const defs=schemaFor(el.dataset.scope,el.dataset.object);if(!defs)return;const key=el.dataset.scope+':'+el.dataset.object,errors=validateFields(defs,draftFor(el.dataset.scope,el.dataset.object).values);state.errors[key]=errors;document.querySelectorAll('[data-field-group]').forEach(group=>{if(group.dataset.scope!==el.dataset.scope||group.dataset.object!==el.dataset.object||group.dataset.field!==el.dataset.field)return;let error=group.querySelector('.field-error');if(errors[el.dataset.field]){if(!error){error=document.createElement('p');error.className='field-error';group.appendChild(error)}error.textContent=errors[el.dataset.field]+(group.querySelector('input[type=range]')?'；请修正精确输入后使用滑块':'')}else if(error)error.remove();group.querySelectorAll('input').forEach(input=>input.setAttribute('aria-invalid',errors[el.dataset.field]?'true':'false'))})}

function taskEligibility(id){if(!state.taskPackage.cachedVersion)return{status:'blocked',reason:'尚无已启用任务包，请先下载并启用',target:'task-updates'};const d=TASKS[id],t=state.tasks[id];if(!state.environment.capture||!state.environment.input)return{status:'blocked',reason:'需要恢复截图与操作授权',target:'environment'};if(state.scene==='unknown')return{status:'unknown',reason:'正在识别当前画面'};if(!d.scenes.includes(state.scene))return{status:'blocked',reason:'当前画面暂不能开始此任务'};if(Object.keys(taskErrors(id,t.values)).length)return{status:'blocked',reason:'任务规则尚未补齐',target:'task/'+id};if(d.needsModel&&(!state.model.enabled||!state.model.verified))return{status:'blocked',reason:'需要配置并验证视觉模型',target:'model'};if(state.issues.some(i=>i.kind==='unknown'&&i.taskId===id&&i.status==='待核对'&&(!i.accountKey||i.accountKey===currentAccountBinding().key)))return{status:'blocked',reason:'上次操作结果未知，需要先核对',target:'issue/'+state.issues.find(i=>i.kind==='unknown'&&i.taskId===id&&i.status==='待核对'&&(!i.accountKey||i.accountKey===currentAccountBinding().key)).id};return{status:'ready',reason:state.scene==='courtyard'?'当前场景含正常导航路径':'当前场景符合模拟开始条件'}}
function eligibility(ref){if(ref.kind==='task')return taskEligibility(ref.id);const p=state.plans[ref.id];if(p?.accountBinding?.key!==currentAccountBinding().key)return{status:'blocked',reason:'计划属于其他账号'};if(!p?.taskIds.length)return{status:'blocked',reason:'计划尚未选择任务',target:'plan/'+ref.id};const results=p.taskIds.map(taskEligibility);const blocked=results.find(x=>x.status==='blocked');if(blocked)return{...blocked,reason:'计划条件未满足：'+blocked.reason};if(results.some(x=>x.status==='unknown'))return{status:'unknown',reason:'正在判断整轮计划的开始条件'};return{status:'ready',reason:'计划全部任务条件及开始场景满足模拟规则'}}

function fields(scope,id,defs){const draft=draftFor(scope,id),errors=state.errors[scope+':'+id]||{};return defs.map(f=>{const value=draft.values[f.key],fieldError=f.type==='number'&&String(value??'').trim()!==''?validateFields([f],draft.values)[f.key]:null;let control='';const attrs=fieldAttr(scope,id,f.key),limits=[['min',f.min],['max',f.max],['step',f.step]].filter(([,v])=>v!==null&&v!==undefined).map(([k,v])=>`${k}="${esc(v)}"`).join(' '),label=f.label+(f.unit?'（'+f.unit+'）':'');if(f.type==='checks'){control=`<div class="choice-field"><div class="choice-label">${esc(label)}</div><div class="choice-group" role="group" aria-label="${esc(label)}">${f.options.map(option=>`<button type="button" class="choice-option" data-action="multi-choice" ${attrs} data-option="${esc(option)}" aria-pressed="${(value||[]).includes(option)}">${esc(choiceLabel(scope,f.key,option))}</button>`).join('')}</div></div>`}else if(f.type==='select'){control=`<div class="choice-field"><div class="choice-label">${esc(label)}</div><div class="choice-group" role="radiogroup" aria-label="${esc(label)}">${f.options.map(o=>`<button type="button" role="radio" aria-checked="${o===value}" tabindex="${o===value||(!f.options.includes(value)&&o===f.options[0])?0:-1}" class="choice-option" data-action="field-choice" ${attrs} value="${esc(o)}">${esc(choiceLabel(scope,f.key,o))}</button>`).join('')}</div></div>`}else if(f.type==='textarea'){control=`<label class="field"><span>${esc(label)}</span><textarea ${attrs} placeholder="${esc(f.placeholder||'按你的规则填写')}">${esc(value)}</textarea></label>`}else if(f.control==='slider'&&Number.isFinite(f.min)&&Number.isFinite(f.max)){control=`<div class="range-field"><label class="field range-exact"><span>${esc(label)}</span><input type="number" ${attrs} ${limits} data-linked-number value="${esc(value)}" inputmode="decimal" autocomplete="off"></label><label class="range-slider"><input aria-label="${esc(label)}滑块" type="range" ${attrs} ${limits} ${fieldError?'disabled aria function taskVersion(version){return state.taskPackage.versions.find(v=>v.version===version)}
function versionDependencies(version){const reasons=[];if(state.taskPackage.operation==='download'&&state.taskPackage.operationVersion===version)reasons.push('正在拉取此版本');if(state.taskPackage.cachedVersion===version)reasons.push('当前正在使用');if(executionSnapshot().runs.some(r=>(!TERMINAL_PHASES.has(r.phase)||r.unresolved)&&Object.values(r.packageVersions).includes(version)))reasons.push('执行队列正在使用');if(state.issues.some(i=>i.packageVersion===version&&i.status==='待核对')||state.history.some(h=>h.packageVersion===version&&(h.needsReview||h.result==='结果未知')))reasons.push('有未核对记录依赖');return reasons}
function taskUpdatesPage(){const p=state.taskPackage,local=p.versions.filter(v=>v.local);if(!local.length)return '<div class="empty">暂无本地版本</div>';return `<div class="list">${local.map(v=>{const current=v.version===p.cachedVersion,deps=versionDependencies(v.version),expanded=p.expandedChangelog.includes(v.version),reason=deps.join('、');return `<div class="version-entry"><div class="row"><button class="row-main" data-action="version-changelog" data-version="${esc(v.version)}" aria-expanded="${expanded}"><span class="row-text"><span class="row-title">${esc(v.version)}</span><span class="row-sub">${esc(v.released)}</span></span></button><span class="version-inline-actions">${button(current?'已启用':'启用','version-use',`data-version="${esc(v.version)}" ${current?'disabled aria-label="已启用此版本"':!v.compatible?'disabled title="此版本需要更新助手" aria-label="此版本需要更新助手"':''}`,'textbtn')}${button('删除','version-delete',`data-version="${esc(v.version)}" ${deps.length?`disabled title="${esc(reason)}" aria-label="不可删除：${esc(reason)}"`:''}`,'textbtn')}</span></div>${expanded?`<ul class="version-changelog">${v.changelog.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`}).join(divider())}</div>`}

function setCloudFixture(value){if(!['online','offline','no-cache','incompatible'].includes(value))return{status:'invalid'};const p=state.taskPackage;if(value==='no-cache'&&executionSnapshot().runs.some(r=>!TERMINAL_PHASES.has(r.phase)||r.unresolved))return{status:'busy'};p.request++;p.source=value;p.operation=null;p.operationVersion=null;p.checked=false;p.status='尚未拉取';p.compatible=value!=='incompatible';p.versions.forEach(v=>v.compatible=!(value==='incompatible'&&v.version===taskPackageFixture.availableVersion));if(value==='no-cache'){p.cachedVersion=null;p.downloadedVersion=null;p.versions.forEach(v=>v.local=false)}render();return{status:'ok'}}

function checkTaskPackage(){const p=state.taskPackage;if(p.operation)return{status:'pending'};const token=++p.request;p.operation='check';p.operationVersion=null;p.status='正在模拟检查';refreshTaskPackageViews();setTimeout(()=>{if(p.request!==token)return;p.operation=null;p.operationVersion=null;p.checked=true;if(['offline','no-cache'].includes(p.source)){p.status=p.cachedVersion?'模拟网络失败，保留本地版本与当前选择':'模拟网络失败，暂无本地任务版本'}else{p.availableVersion=taskPackageFixture.availableVersion;p.compatible=taskVersion(p.availableVersion).compatible;p.status=p.compatible?'已获取版本目录与更新说明':'新任务需要更新助手'}refreshTaskPackageViews()},450);return{status:'pending'}}
function downloadTaskPackage(version=taskPackageFixture.availableVersion,trigger='manual'){const p=state.taskPackage;if(p.operation)return{status:'pending'};const v=taskVersion(version);if(!v)return{status:'unavailable'};const token=++p.request;p.operation='download';p.operationVersion=version;p.operationNetworkRoute=networkRouteFor('task-source');notify('正在拉取');p.status=(trigger==='startup'?'启动自动拉取':'正在拉取')+' '+version+'（模拟）';refreshTaskPackageViews();setTimeout(()=>{if(p.request!==token)return;p.operation=null;p.operationVersion=null;p.checked=true;if(['offline','no-cache'].includes(p.source)){p.status=p.cachedVersion?'模拟网络失败，保留本地版本与当前选择':'模拟网络失败，暂无本地任务版本';if(trigger==='startup')p.startup.status='failed'}else if(!v.compatible){p.status='新任务需要更新助手；本地版本保持不变';if(trigger==='startup')p.startup.status='incompatible'}else{v.local=true;p.downloadedVersion=version===p.cachedVersion?null:version;p.status='已拉取 '+version+'；当前选择保持不变';if(trigger==='startup')p.startup.status='downloaded'}notify(['offline','no-cache'].includes(p.source)?'拉取失败，请检查网络':!v.compatible?'新任务需要更新助手':'拉取完成');refreshTaskPackageViews()},450);return{status:'pending',version}}
function useTaskVersion(version){const p=state.taskPackage,v=taskVersion(version);if(!v?.local)return{status:'unavailable'};if(!v.compatible){notify('此版本需要更新助手');return{status:'incompatible'}}if(executionSnapshot().runs.some(r=>!TERMINAL_PHASES.has(r.phase)||r.unresolved)){notify('请先处理执行队列');return{status:'busy'}}p.cachedVersion=version;if(p.downloadedVersion===version)p.downloadedVersion=null;p.status='已选择使用 '+version;render();notify('已启用');return{status:'activated',version}}
function activateTaskPackage(){const version=state.taskPackage.downloadedVersion;return version?useTaskVersion(version):{status:'unavailable'}}
function deleteTaskVersion(version){const v=taskVersion(version);if(!v?.local)return{status:'unavailable'};const reasons=versionDependencies(version);if(reasons.length){notify('不可删除：'+reasons.join('、'));return{status:'occupied',reasons}}v.local=false;if(state.taskPackage.downloadedVersion===version)state.taskPackage.downloadedVersion=null;state.taskPackage.status='已删除本地 '+version+'，远端版本仍可重新拉取';render();return{status:'deleted',version}}
function toggleChangelog(version){if(!taskVersion(version))return{status:'unavailable'};const p=state.taskPackage;p.expandedChangelog=p.expandedChangelog.includes(version)?p.expandedChangelog.filter(v=>v!==version):[...p.expandedChangelog,version];render();return{status:'ok'}}
function startupTaskPull(){const p=state.taskPackage;if(p.startup.count)return{status:'already-triggered'};p.startup.count=1;p.startup.status='pulling';return downloadTaskPackage(taskPackageFixture.availableVersion,'startup')}
function taskListPage(){if(!state.taskPackage.cachedVersion)return `<div class="empty">暂无可用任务<br>${button('任务更新','navigate','data-target="task-updates"','tonal')}</div>`;const defs=TASK_DEFS.filter(d=>d.category===state.category&&(state.period==='全部'||d.period===state.period));return `<div class="task-center"><div class="category-tabs" data-scroll-land="land:tasks:categories"><div class="chips">${Object.entries(CATEGORIES).map(([id,c])=>button(c.name,'category',`data-category="${id}"`,state.category===id?'chip selected':'chip')).join('')}</div>${state.category==='daily'?`<div class="chips period-tabs">${['全部','每日','每周'].map(v=>button(v,'period',`data-period="${v}"`,state.period===v?'chip selected':'chip')).join('')}</div>`:''}</div><div class="list task-grid" data-scroll-land="land:tasks:${esc(state.category)}:${esc(state.period)}:list">${defs.map(d=>executionRow({kind:'task',id:d.id})).join(divider())}</div></div>`}
function taskPage(id){if(!state.taskPackage.cachedVersion)return '<div class="empty">尚未启用任务版本</div>';const d=TASKS[id],t=state.tasks[id];if(!d)return '<div class="empty">任务不存在</div>';let special='';if(d.category==='daily')special=facts([['周期',d.period],['领取状态',lastTaskResult(id)||'等待核对资格与可领取物资']]);if(d.category==='shops')special=facts([['开放条件','按所选商店实际开放状态'],['本周期结果',lastTaskResult(id)||'尚未执行']]);if(id==='soul-sort')special=`<div class="inline-note">筛选命中不代表可消耗。锁定、装备中及正在强化对象按保留规则处理。</div>`;if(id==='event-auto')special=`<div class="inline-note">目标、资源和允许操作由你设置。规则不确定时保留问题，不扩大预算。</div>`;return `<div class="task-editor"><div class="task-context" data-scroll-land="land:task/${esc(id)}:context"><p class="section-copy">${esc(d.impact)}</p>${special}<details><summary class="task-steps-summary">执行步骤 · ${d.steps.length} 步</summary><ol class="task-steps">${d.steps.map(step=>`<li>${esc(step.label)}</li>`).join('')}</ol></details></div><div class="form task-fields" data-scroll-land="land:task/${esc(id)}:fields">${fields('task',id,d.fields)}</div><div class="task-extras" data-scroll-land="land:task/${esc(id)}:extras">${['soul-enhance','soul-sort'].includes(id)?`<div class="list">${row('soul','预览处理对象','核对命中与保留原因','preview/'+id)}</div>`:''}${d.category==='activities'?`<div class="list">${row('star','活动规则与进度','目标、阶段及不确定事项','activity/'+id)}</div>`:''}${section('最近结果')}${currentAccountHistory().findLast(h=>h.kind==='task'&&h.refId===id)?`<div class="list">${row('messages',lastTaskResult(id)||'查看本任务记录','','history/'+currentAccountHistory().findLast(h=>h.kind==='task'&&h.refId===id).id)}</div>`:'<p class="section-copy">暂无执行记录</p>'}</div></div>`}

d="${d.values.taskIds.includes(t.id)}">${esc(t.name)}</button>`).join('')}</div></div></div></div>`}

const DEMO_GAME_ACCOUNTS={a:{uid:'demo-account-a',name:'账号 A',server:'demo-server',channel:'demo-channel',gameVersion:'demo-game-1',deviceKey:'demo-device-1'},b:{uid:'demo-account-b',name:'账号 B',server:'demo-server',channel:'demo-channel',gameVersion:'demo-game-1',deviceKey:'demo-device-1'}};
function gameSnapshot(){return gameSessionEngine.getSnapshot()}
function accountKey(a){return a?JSON.stringify([a.uid,a.server,a.channel,a.deviceKey]):null}
function currentAccountBinding(){const a=gameSnapshot().currentAccount;return {key:accountKey(a),name:a?.name||'待核对账号'}}
function currentAccountPlans(){return Object.values(state.plans).filter(p=>p.accountBinding?.key===currentAccountBinding().key)}
function currentAccountHistory(){return state.history.filter(h=>h.accountKey===currentAccountBinding().key)}
function lastTaskResult(id){return state.tasks[id].lastResultsByAccount?.[currentAccountBinding().key]||null}

function gameOperationPending(){const o=gameSnapshot().operation;return !!o&&o.stage!=='completed'}
function gameIdentityReady(){const g=gameSnapshot();return !gameOperationPending()&&g.gameStatus==='running'&&['observed-demo','verified-demo'].includes(g.identityStatus)}
function gameStatusLabel(){const g=gameSnapshot(),o=g.operation;if(o&&o.stage!=='completed')return ({waiting_quiescence:'等待输入静默',awaiting_identity:'登录账号待核对',awaiting_rollback_identity:'回退账号待核对',failed:'账号核对失败'})[o.stage]||'处理中';if(g.identityStatus==='requires_recheck')return '启动后待授权核对';return g.gameStatus==='running'?'运行中':'已关闭'}
function accountLabel(a){return a?.name||'尚未核对'}
function selectedLaunchAccount(){const g=gameSnapshot();return g.gameStatus==='stopped'&&g.selectedAccountId!=='current'?g.accounts.find(a=>a.id===g.selectedAccountId)||g.currentAccount:g.currentAccount}
function savedCurrentAccount(){const g=gameSnapshot();return g.accounts.some(a=>accountKey(a)===accountKey(g.currentAccount))}
function workbenchGameHeader(){const g=gameSnapshot(),a=selectedLaunchAccount(),pending=gameOperationPending(),stopped=g.gameStatus==='stopped',canSelect=stopped&&!pending,next=stopped&&g.selectedAccountId!=='current';return `<div class="workbench-game"><button class="workbench-account" data-action="game-account-menu" aria-label="${esc((next?'下次启动账号':'当前账号')+' '+(a?.server||'')+' '+accountLabel(a)+(canSelect?'，选择登录账号':'，游戏启动后不可切换'))}" aria-haspopup="menu" aria-expanded="${!!state.accountPickerOpen}" ${canSelect?'':'disabled'} title="${esc(gameStatusLabel())}"><i class="account-dot ${g.gameStatus==='running'?'running':''}" aria-hidden="true"></i><span class="account-copy"><small>${esc(a?.server||'未识别大区')}${next?' · 下次启动':''}</small><strong>${esc(accountLabel(a))}</strong></span>${canSelect?icon('chevron'):''}</button>${g.gameStatus==='running'&&!pending&&!savedCurrentAccount()?iconButton('save','保存当前账号登录态','game-capture-prompt','title="保存账号登录态"'):''}${stopped?iconButton('play','启动游戏','game-start',pending?'disabled':'title="启动游戏"'):iconButton('stop','停止游戏','game-close',pending?'disabled':'title="停止游戏"')}</div>${state.accountPickerOpen&&canSelect?accountPicker():''}`}

function workbenchGameNotice(){const g=gameSnapshot(),o=g.operation;if(o&&['waiting_quiescence','awaiting_identity','awaiting_rollback_identity','failed'].includes(o.stage))return `<div class="issuestrip workbench-alert">${icon('warn')}<span class="row-text"><span class="row-title">${esc(gameStatusLabel())}</span></span>${o.rollbackAvailable?iconButton('back','恢复切换前状态','game-rollback','',true):''}</div>`;return g.boot.requiresAuthorization?'<div class="inline-note warn">开机恢复待授权核对</div>':''}
function gameControlPage(){const g=gameSnapshot();return `<div class="list">${row('phone','账号资料',g.accounts.length+' 个已保存账号','accounts')}</div>${switchRow('助手开机自启','',g.autoStart,'game-autostart')}${g.boot.requiresAuthorization?'<div class="inline-note warn">开机恢复待授权核对</div>':''}`}

function accountsPage(){const g=gameSnapshot();return g.accounts.length?`<div class="list">${g.accounts.map(a=>row('phone',a.name,a.server+' · '+(a.validation==='verified-demo'?'仅演示核对':'未验证'),'account/'+a.id)).join(divider())}</div>`:'<div class="empty">暂无已保存账号<br>登录游戏后，可在工作台保存。</div>'}

function accountPage(id){const a=gameSnapshot().accounts.find(a=>a.id===id);if(!a)return '<div class="empty">没有该本地快照</div>';return `<div class="form">${fields('account',id,[F('name','快照名称','text',{required:true})])}</div>${facts([['账号标识',a.uid],['区服',a.server],['渠道',a.channel],['快照状态',a.validation==='verified-demo'?'仅通过演示核对':'保存后尚未验证'],['游戏版本',a.gameVersion]])}<div class="form">${button('删除本地快照','game-delete-account',`data-account-id="${id}"`,'textbtn danger')}</div>`}
function gameResult(result){if(!result.ok&&result.message)notify(result.message);return result}
function requestGameAction(kind,accountId){const before=gameSnapshot(),result=gameSessionEngine.begin({commandId:executionCommand('game-'+kind),kind,...(accountId?{accountId}:{}),hasUnknownResults:executionSnapshot().runs.some(r=>!!r.unresolved)});if(!result.ok){notify(result.message||'操作条件未满足');return result}gameHostOperation={id:result.operationId,originalAccount:copy(before.currentAccount)};executionEngine.pause({commandId:executionCommand('game-pause')});advanceGameOperation();render();return result}
function advanceGameOperation(){const g=gameSnapshot(),o=g.operation;if(!o||o.stage!=='waiting_quiescence'||!executionSnapshot().scheduler.manualHold||executionSnapshot().inputOwner)return;const result=gameSessionEngine.confirmQuiescent({commandId:executionCommand('game-quiescent'),operationId:o.id,inputQuiescent:true});if(result.ok){state.scene='unknown';state.sceneRevision++;refreshExecutionReadiness();if(result.status==='completed'&&g.operation.kind==='capture')notify('快照已保存，恢复尚未验证')}else notify(result.message)}
function confirmGameIdentity(key=state.reviewGameAccount){const g=gameSnapshot(),o=g.operation;if(!o)return{ok:false,status:'no_operation'};const observed=DEMO_GAME_ACCOUNTS[key];if(!observed)return{ok:false,status:'invalid_identity'};const result=gameSessionEngine.confirmIdentity({commandId:executionCommand('game-identity'),operationId:o.id,uid:observed.uid,name:observed.name,server:observed.server,channel:observed.channel,observationId:'review-game:'+state.serial++});if(result.ok){const after=gameSnapshot();if(result.status==='identity-verified-demo'&&gameHostOperation?.id===o.id&&accountKey(gameHostOperation.originalAccount)!==accountKey(after.currentAccount)){for(const run of executionSnapshot().runs.filter(r=>!TERMINAL_PHASES.has(r.status)))executionEngine.remove({commandId:executionCommand('account-clear-queue'),runId:run.runId,reason:'切换账号后清空原队列'})}gameSessionEngine.selectAccount({commandId:executionCommand('game-select-current'),accountId:'current'});state.scene='courtyard';state.sceneRevision++;refreshExecutionReadiness();notify(result.status==='rolled-back-demo'?'原账号已核对，队列保持暂停':'账号已核对，队列保持暂停')}else notify(result.message);render();return result}
function rollbackGameAccount(){const o=gameSnapshot().operation;if(!o)return{ok:false,status:'no_operation'};const result=gameSessionEngine.rollback({commandId:executionCommand('game-rollback'),operationId:o.id});gameResult(result);refreshExecutionReadiness();render();return result}
function reviewGameMode(mode){const result=gameSessionEngine.setCapabilities({commandId:executionCommand('game-capability'),mode});render();return result}

function networkFields(v){const mode=SELECT('mode','连接方式',['直接连接','使用代理']);return v.mode==='使用代理'?[mode,SELECT('type','代理类型',['HTTP','SOCKS5'],{required:true}),F('host','代理地址','text',{required:true,placeholder:'127.0.0.1 或 proxy.example.com'}),NUMBER('port','端口',{min:1,max:65535,step:1,required:true}),SELECT('auth','代理认证',['不需要认证','用户名和密码']),...(v.auth==='用户名和密码'?[F('username','用户名','text',{required:true})]:[]),CHECKS('scopes','走代理的请求',['model','task-source','notifications'],{required:true})]:[mode]}
function networkConnection(v){return JSON.stringify([v.type,v.host,v.port,v.auth,v.username])}
function networkDraftKey(){const v=draftFor('network').values;if(v.mode!=='使用代理'||v.auth!=='用户名和密码')return '';const connection=networkConnection(v);return secrets.networkDraftBinding===connection&&secrets.networkDraft?secrets.networkDraft:secrets.networkKeys[connection]||''}
function networkRouteFor(scope){if(!['model','task-source','notifications'].includes(scope))return{mode:'invalid_scope',scope};const n=state.network,use=n.mode==='使用代理'&&n.scopes.includes(scope);return {mode:use?'proxy':'direct',type:use?n.type:null,scope,revision:n.revision}}
function networkPage(){const v=draftFor('network').values,error=state.errors['network:main']?.credential;return `<div class="form network-fields">${fields('network','main',networkFields(v))}${v.mode==='使用代理'&&v.auth==='用户名和密码'?`<div class="network-credential"><label class="field"><span>密码</span><input type="password" id="network-key" value="${esc(secrets.networkDraftBinding===networkConnection(v)?secrets.networkDraft:'')}" placeholder="${secrets.networkKeys[networkConnection(v)]?'已保存密码':'代理密码'}" autocomplete="off"></label>${error?`<p class="field-error">${esc(error)}</p>`:''}</div>`:''}</div>${state.networkTest?`<div class="inline-note">${esc(state.networkTest.message)}</div>`:''}`}
function validateNetwork(){const v=draftFor('network').values,errors=validateFields(networkFields(v),v);if(v.mode==='使用代理'&&v.host){try{const u=new URL('http://'+v.host);if(!u.hostname||u.port||u.username||u.password||u.pathname!=='/'||u.search||u.hash)errors.host='请输入主机名或IP，协议和端口单独设置'}catch{errors.host='请输入有效主机名或IP'}}if(v.mode==='使用代理'&&v.auth==='用户名和密码'&&!networkDraftKey())errors.credential='请填写代理密码';state.errors['network:main']=errors;if(Object.keys(errors).length){render();notify('请补齐标出的代理配置');return false}return true}
function saveNetwork(){if(!validateNetwork())return false;const d=draftFor('network'),v=d.values,key=networkDraftKey();if(v.mode==='使用代理'&&v.auth==='用户名和密码')secrets.networkKeys[networkConnection(v)]=key;state.network={...copy(v),keyPresent:!!key,revision:state.network.revision+1};secrets.networkDraft='';secrets.networkDraftBinding='';d.dirty=false;state.networkTest=null;render();notify('网络设置已保存');return true}
function testNetwork(){if(!validateNetwork())return false;state.networkTest={message:'配置检查通过（模拟，未连接代理）'};render();return true}

function channelsPage(){return `<div class="list">${Object.values(state.channels).map(c=>row(c.type==='local'?'phone':'messages',c.name,CHANNEL_TYPES[c.type]+' · '+(c.enabled?'已启用':'未启用'),'channel/'+c.id)).join(divider())}</div>`}
function channelFields(v){const common=[F('name','渠道名称','text',{required:true}),SELECT('type','渠道类型',Object.keys(CHANNEL_TYPES))];if(['webhook','dingtalk','wecom'].includes(v.type))return [...common,F('url',v.type==='webhook'?'接收地址':'机器人 Webhook','url',{required:true}),...(v.type==='dingtalk'?[F('keyword','消息关键词（选填）')]:[])];if(v.type==='bark')return [...common,F('url','Bark 服务器','url',{required:true,placeholder:'https://api.day.app'})];if(v.type==='email')return [...common,F('server','SMTP 服务器','text',{required:true}),NUMBER('port','端口',{required:true,min:1,max:65535,step:1}),SELECT('encryption','连接安全',['SSL/TLS','STARTTLS','无加密'],{required:true}),SELECT('auth','认证方式',['需要认证','无需认证'],{required:true}),...(v.auth==='需要认证'?[F('username','登录账号','text',{required:true})]:[]),F('from','发件邮箱','email',{required:true}),F('to','收件邮箱','email',{required:true})];return common}

function channelConnection(id,v){return JSON.stringify([id,v.type,v.url||'',v.server||'',v.port||'',v.encryption||'',v.auth||'',v.username||''])}
function channelCredential(id,v=draftFor('channel',id).values){const connection=channelConnection(id,v);return secrets.channelDrafts[connection]||secrets.channelSaved[connection]||''}
function channelPage(id){const v=draftFor('channel',id).values,connection=channelConnection(id,v),label=v.type==='bark'?'设备密钥 Device Key':v.type==='dingtalk'?'加签密钥（选填）':v.type==='email'?'邮箱授权码／密码':'认证信息（选填）',error=state.errors['channel:'+id]?.credential;return `<div class="channel-editor"><div class="form channel-fields">${fields('channel',id,channelFields(v))}${channelNeedsSecret(v)?`<div class="channel-credential"><label class="field"><span>${label}</span><input type="password" data-channel-secret="${esc(id)}" value="${esc(secrets.channelDrafts[connection]||'')}" placeholder="${secrets.channelSaved[connection]?'已保存凭据':label}" autocomplete="off"></label>${error?`<p class="field-error">${esc(error)}</p>`:''}</div>`:''}${v.type==='local'&&!state.environment.notification?'<p class="help">本机通知权限未开启，请在运行环境恢复。</p>':''}</div>${switchRow('启用渠道','',!!v.enabled,'channel-enabled',`data-id="${id}"`)}<div class="form">${fields('channel',id,[CHECKS('events','订阅事件',EVENT_CATALOG.map(e=>e.id))])}</div><div class="list">${row('settings','管理事件规则','','event-rules')}</div></div>`}

const RULE_DESCRIPTIONS={
 'task-started':'任务真正开始时触发，恢复原任务不重复触发。',
 'task-succeeded':'任务成功完成并核对结果后触发。',
 'plan-started':'一轮计划首次开始时触发，恢复不重复触发。',
 'plan-completed':'一轮计划结束，按所选结果触发。',
 'execution-failed':'同一任务或计划连续达到所设失败次数；部分失败计入，成功后重新计数，结果未知不算失败。',
 'unknown-result':'操作结果无法确认时触发，移除执行项不会清除未知结果。',
 'queue-wait':'首次开始前，累计排队等待达到所设时长。',
 'no-progress':'实际执行期间，步骤进度长时间未推进；已识别的正常战斗、等待和人工暂停不计入。',
 'condition-lost':'有执行或排队事项时，截图或操作能力不可用。',
 'resource-shortage':'资源不足或容量受限持续达到所设时长。',
 'vision-unavailable':'正在使用的视觉服务不可用持续达到所设时长。'};
function eventRule(id){return eventRulesEngine.getSnapshot().rules.find(r=>r.id===id)}
function eventRuleDraft(id){const r=eventRule(id),ms=r.thresholdMs??r.recommendedThresholdMs;return {enabled:r.enabled,thresholdCount:String(r.thresholdCount??r.recommendedThresholdCount??''),thresholdHours:ms===undefined?'':String(Math.floor(ms/3600000)),thresholdMinutes:ms===undefined?'':String(Math.floor(ms%3600000/60000)),results:copy(r.results)}}
function eventRuleFields(id){const r=eventRule(id);return r.kind==='count'?[NUMBER('thresholdCount','连续失败次数',{min:1,step:1})]:r.kind==='duration'?[NUMBER('thresholdHours','小时',{min:0,step:1}),NUMBER('thresholdMinutes','分钟',{min:0,max:59,step:1})]:r.kind==='result'?[CHECKS('results','结束结果',['completed','partial_failed','failed','cancelled'],{required:true})]:[]}
function ruleSummary(r){const threshold=r.kind==='count'?'连续 '+(r.thresholdCount??r.recommendedThresholdCount)+' 次':r.kind==='duration'?'持续 '+Math.floor((r.thresholdMs??r.recommendedThresholdMs)/60000)+' 分钟':r.kind==='result'?(r.results||[]).map(v=>choiceLabel('event-rule','results',v)).join('、'):'发生时触发';return (r.enabled?'已启用':'未启用')+' · '+threshold}

function renderBoard(name){if(name==='overlays'){const land=params.get('orientation')==='landscape';document.getElementById('root').innerHTML=`<div class="board-heading"><h1>07 · 一套悬浮交互，三个层级</h1><p>小球 → 快捷面板 → 常用列表。当前运行行只显示一处；展开、返回和收起不改变运行。横竖屏复用相同层级与数据。</p></div><div class="board ${land?'landboard':''}">${[['ball','1 · 收起小球'],['quick','2 · 快捷面板'],['common','3 · 常用列表']].map(([layer,label])=>`<article><div class="art-title">${label}</div>${gameDevice(layer,land)}<p class="art-note">${esc(SCENES[state.scene])} · 常用 ∩ 当前可开始；当前运行独立于候选并去重。</p></article>`).join('')}</div>`;return}const b=BOARDS[name]||BOARDS.main,oldDeveloper=state.developer;if(name==='diagnostics')state.developer=true;document.getElementById('root').innerHTML=`<div class="board-heading"><h1>${b.title}</h1><p>完整可评审原型。示例数据和数值不构成默认值，均未连接真实服务；未保存草稿会保留在本次内存会话。</p></div><div class="board ${b.land?'landboard':''} ${b.pages.length===2?'double':''}">${b.pages.map(page=>`<article><div class="art-title">${esc(titleFor(page))} <span class="section-sub">${esc(page)}</span></div>${appDevice(page,!!b.land)}<p class="art-note">${esc(page==='diagnostics'?'仅本图显式开启开发模式，不开放强制执行。':'配置与运行状态共用同一数据，截图中的字段为演示值。')}</p></article>`).join('')}</div>`;state.developer=oldDeveloper}
function renderReviewControls(){document.getElementById('review-controls').innerHTML=`${button('主 App','review-view','data-view="app"',state.view==='app'?'selected':'')}${button('游戏内控制','review-view','data-view="game"',state.view==='game'?'selected':'')}<label>方向<select data-review="orientation"><option value="portrait" ${state.orientation==='portrait'?'selected':''}>竖屏</option><option value="landscape" ${state.orientation==='landscape'?'selected':''}>手机横屏</option></select></label><label>云端任务夹具<select data-review="cloud">${[['online','可用更新'],['offline','网络失败·有缓存'],['no-cache','网络失败·无缓存'],['incompatible','新包不兼容']].map(([id,n])=>`<option value="${id}" ${state.taskPackage.source===id?'selected':''}>${n}</option>`).join('')}</select></label><label>模拟画面<select data-review="scene">${Object.entries(SCENES).map(([id,n])=>`<option value="${id}" ${id===state.scene?'selected':''}>${n}</option>`).join('')}</select></label><label>悬浮层级<select data-review="layer">${[['ball','1 小球'],['quick','2 快捷面板'],['common','3 常用列表']].map(([id,n])=>`<option value="${id}" ${id===state.overlayLayer?'selected':''}>${n}</option>`).join('')}</select></label>${button('提交一步','execution-step','','')}${button('核对安全点','execution-checkpoint','','')}${button('核对并继续','execution-confirm','','')}${button('确认任务失败','execution-fail','','')}${button('确认移除静默','execution-removal-confirm','','')}${button('等待 +1 分钟','execution-wait','','')}<label>到点计划<select data-review="due-plan">${Object.values(state.plans).map(p=>`<option value="${p.id}" ${state.reviewDuePlan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>${button('模拟到点','execution-due','','')}<label>游戏能力<select data-review="game-mode">${[['unknown','未检测'],['normal-demo','普通演示'],['root-demo','Root演示']].map(([id,name])=>`<option value="${id}" ${gameSnapshot().capabilities.mode===id?'selected':''}>${name}</option>`).join('')}</select></label><label>演示账号<select data-review="game-account">${Object.entries(DEMO_GAME_ACCOUNTS).map(([id,a])=>`<option value="${id}" ${state.reviewGameAccount===id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>${button('模拟已登录','review-game-observed','','')}${button('核对登录身份','review-game-confirm','','')}${button('模拟开机','review-game-boot','','')}${button('隐藏／唤出悬浮','review-hide','','')}<label>页面组图<select data-review="board"><option value="">交互预览</option>${Object.entries(BOARDS).map(([id,b])=>`<option value="${id}" ${params.get('board')===id?'selected':''}>${b.title}</option>`).join('')}<option value="overlays" ${params.get('board')==='overlays'?'selected':''}>07 · 游戏内控制</option></select></label>`}
function render(){projectNotificationEvents();cancelQueueSwipe();cancelLongPress();captureScroll();renderReviewControls();const board=params.get('board');document.body.classList.toggle('board-mode',!!board);if(board){renderBoard(board)}else{document.getElementById('root').innerHTML=`<div class="stage">${state.view==='game'?gameDevice():appDevice()}<aside class="annotations"><h2>${state.view==='game'?'游戏内控制评审':titleFor(state.page)}</h2><p>页面与操作均为内存模拟，不发送任何真实请求。</p><div class="note">任务正文配置具体步骤和参数，计划引用任务并指定时间。列表右侧提交本次执行请求；计划保存只登记日程。优先级与步骤为任务包演示值，不构成生产默认范围。</div><h3>输入控件契约</h3><p>字段 schema 显式包含 control/min/max/step/unit。有限边界使用滑块与精确数字联动；次数、预算不虚构上限。悬浮大小 36–80、透明度 20–100 沿用演示边界，不是新增产品默认值。inputs 图组日期仅是控件示例。</p><h3>任务容器与云端包</h3><p>22 项为已缓存云目录的演示内容，非 APK 内置生产清单。任务流程、识别资源及配置表单来自任务包；本稿用本地夹具模拟检查与下载，没有网络、服务器或持久化。稳定任务 ID 保留配置、常用与计划引用；运行绑定启用时的包版本。启动仅触发一次最新版拉取；导航与旋转不再触发。不设额外定时周期、不自动选择版本。版本摘要、发布日期和更新说明均是本地夹具示意，非真实校验或发布记录。可用 cloud=offline/no-cache/incompatible 演示不同启动条件。</p><h3>场景过滤示意</h3><p>庭院包含正常导航路径；副本、商店、御魂场景仅演示对应任务；未知场景表示等待识别。这不是已验证的游戏映射。</p><h3>运行与异常</h3><p>任务是步骤集合，计划是任务集合与执行时间。整计划按成员优先级总和入队，自动抢占保留检查点；手动暂停或停止全局等待继续，继续先重新观察核对。修改配置不清除未知消费结果。</p><h3>手势演示</h3><p>当前运行暂停按钮短按暂停/继续、长按停止。网页长按用600ms、右滑用64px演示判定，Android应遵循平台约定；这些数值不作为产品阈值。队列右滑移除与手动停止不同：移除不新设全局暂停，在途输入由独立dispatcher确认静默。计划保存仅模拟按时生效，未建立真实调度器。“本轮完成＋可选最长运行时长”为本轮评审提案，结构化约束绑定运行快照，尚无实际时长计时或游戏执行。</p><h3>评审边界</h3><p>开发者模式默认关闭，只在设置开启。通知管理包含渠道、事件规则和事件记录，规则只产事件，订阅才决定投递；悬浮交互已统一为一套三层。</p></aside></div>`}if(state.modal&&state.modal.type!=='run-menu')document.getElementById('root').insertAdjacentHTML('beforeend',dialog());restoreScroll();bindPointerControls()}
const scrolls={};
function scrollOwnerKey(element){if(element.dataset.scrollLand)return element.closest('.device.land')?element.dataset.scrollLand:null;if(!element.dataset.scroll)return null;const device=element.closest('.device');return element.dataset.scroll+':'+(device?.classList.contains('land')?'landscape':'portrait')}
function captureScroll(){document.querySelectorAll('[data-scroll],[data-scroll-land]').forEach(element=>{const key=scrollOwnerKey(element);if(key)scrolls[key]=element.scrollTop})}
function restoreScroll(){document.querySelectorAll('[data-scroll],[data-scroll-land]').forEach(element=>{const key=scrollOwnerKey(element);if(key&&scrolls[key]!==undefined)element.scrollTop=scrolls[key]})}
function dialog(){const m=state.modal;if(m.type==='capture-account')return `<div class="review-dialog-shade" data-action="close-modal"><div class="review-dialog" data-modal-content><h3>${esc(m.title)}</h3><p>${esc(m.message)}</p><div class="buttons">${button('取消','close-modal','','textbtn')}${button('保存','game-capture-confirm')}</div></div></div>`;if(m.type==='blocked')return `<div class="review-dialog-shade" data-action="close-modal"><div class="review-dialog" data-modal-content><h3>暂时不能开始</h3><p>${esc(m.reason)}</p><div class="buttons">${button('返回','close-modal','','textbtn')}${m.target?button('前往相关设置','blocked-target',`data-target="${m.target}"`):''}</div></div></div>`;return `<div class="review-dialog-shade" data-action="close-modal"><div class="review-dialog" data-modal-content><h3>${esc(m.title||'当前操作')}</h3><p>${esc(m.message||'')}</p><div class="buttons">${button('关闭','close-modal','','textbtn')}</div></div></div>`}
function notify(text){const e=document.getElementById('toast');e.textContent=text;e.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.add('hidden'),3300)}
function urlUpdate(){if(params.get('board'))return;const u=new URL(location.href);u.search=`?view=${state.view}&orientation=${state.orientation}&scene=${state.scene}&layer=${state.overlayLayer}`;u.hash=state.page;history.replaceState({},'',u)}
function navigate(page,remember=true){if(page==='game'){state.view='game';state.overlayHidden=false;urlUpdate();render();return}if(page==='export-records'){download('yys-prototype-records.json',safeRecords());return}if(page==='clear-records'){state.history=[];state.deliveries=[];notify('已清理');render();return}if(page==='diagnostics'&&!state.developer){notify('请先在设置开启开发者模式');return}if(remember&&page!==state.page)state.back.push(state.page);state.page=page;state.view='app';state.modal=null;state.accountPickerOpen=false;urlUpdate();render()}
function saveSettings(scope){const d=draftFor(scope),defs=scope==='float'?FLOAT_FIELDS:DATA_FIELDS,errors=validateFields(defs,d.values);state.errors[scope+':main']=errors;if(Object.keys(errors).length){render();notify('请修正标出的数值');return false}if(scope==='float')state.float=copy(d.values);else state.data=copy(d.values);d.dirty=false;render();notify('已保存');return true}
function saveEventRule(id){const d=draftFor('event-rule',id),v=d.values,r=eventRule(id),errors=v.enabled?validateFields(eventRuleFields(id),v):{},request={commandId:executionCommand('event-rule'),ruleId:id,enabled:!!v.enabled};if(r.kind==='duration'){const ms=(Number(v.thresholdHours)*60+Number(v.thresholdMinutes))*60000;if(v.enabled&&(!Number.isSafeInteger(ms)||ms<=0))errors.thresholdMinutes='总时长需大于 0';request.thresholdMs=Number.isSafeInteger(ms)&&ms>0?ms:null}if(r.kind==='count'){const count=Number(v.thresholdCount);if(v.enabled&&(!Number.isSafeInteger(count)||count<1))errors.thresholdCount='请输入大于 0 的整数';request.thresholdCount=Number.isSafeInteger(count)&&count>0?count:null}if(r.kind==='result')request.results=v.results;state.errors['event-rule:'+id]=errors;if(Object.keys(errors).length){render();notify('请修正规则条件');return false}const result=eventRulesEngine.configure(request);if(!result.ok){notify('规则配置未保存');return false}d.dirty=false;projectNotificationEvents();render();notify('已保存');return true}

function requestRemoveExecution(runId){const result=executionEngine.remove({commandId:executionCommand('remove'),runId});if(!result.ok&&result.message)notify(result.message);return result}
