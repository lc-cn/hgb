# Builds the server and ships it to the host (docs/development/deploy.md). The package is uploaded as this run's
# artifact; over SSH the host only gets `fetch <commit>-<run>-<attempt>` and a short-lived download link with the
# package's SHA-256, downloads it itself (it reaches GitHub ~80x faster than a runner can push to it) and checks the
# digest (deploy/host/hgb-receive). deploy/host/hgb-activate then snapshots the database, switches the release and
# rolls back if it is not healthy.
name: Deploy server

on:
  push:
    branches: [master]
    paths:
      - core/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/deploy-server.yml
      - deploy/host/**
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than cancelling one half done.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to hand the host a download link for this run's artifact

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and package the server
        run: ./gradlew --no-daemon :core:protocol:test :core:engine:test :core:server:test :core:server:distTar

      - name: Compress the package
        # hgb-receive reads a gzipped tar whose top directory is server/.
        run: gzip -c core/server/build/distributions/server.tar > server.tgz

      - name: Upload the package
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ github.run_id }}-${{ github.run_attempt }}
          path: server.tgz
          retention-days: 1
          compression-level: 0 # already gzipped

      - name: Have the host fetch and activate it
        env:
          SSH_KEY: ${{ secrets.HGB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HGB_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.HGB_DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # GitHub answers with a signed link to the artifact that works for about a minute, without a token.
          url=$(curl -fsS -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip")
          jq -n --arg url "$url" --arg sha "$(sha256sum server.tgz | cut -d' ' -f1)" --argjson bytes "$(stat -c%s server.tgz)" \
            '{url: $url, sha256: $sha, bytes: $bytes}' |
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "hgb-deploy@$HOST" "fetch ${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f ~/.ssh/deploy
