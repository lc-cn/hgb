# Builds the signed Android App for a version tag (v1.2.3) and publishes it as a GitHub release of this repository.
# Task bundles are released in lc-cn/hgb-tasks, so this repository's releases hold only installers (C46).
name: Release App

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Tag must look like v1.2.3, got $tag"; exit 1; }
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          # 1.2.3 -> 10203; each part below 100.
          echo "code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the SDK parts the App builds with
        # The runner image ships the Android SDK and its sdkmanager; only the pieces this build pins are added.
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Prepare the pinned Maa native libraries
        # Downloads the MaaFramework release named in client/android/vision/inputs.lock.json and checks every file's SHA-256.
        run: python3 tools/qa/prepare_maa_inputs.py --native-only

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the signed APK
        env:
          KEYSTORE: ${{ secrets.HGB_ANDROID_KEYSTORE }}
          HGB_SIGNING_STORE_PASSWORD: ${{ secrets.HGB_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export HGB_SIGNING_STORE_FILE="$RUNNER_TEMP/hgb-release.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$HGB_SIGNING_STORE_FILE"
          ./gradlew --no-daemon :core:engine:test :client:shared:desktopTest :client:android:app:testDebugUnitTest \
            :client:android:app:assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} -PappVersionCode=${{ steps.version.outputs.code }}
          rm -f "$HGB_SIGNING_STORE_FILE"

      - name: Check the signature
        run: |
          apk=client/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -q "CN=HuGanBao"
          mkdir dist
          cp "$apk" "dist/hgb-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum "hgb-${{ steps.version.outputs.name }}.apk" > "hgb-${{ steps.version.outputs.name }}.apk.sha256")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "护肝宝 ${{ steps.version.outputs.name }}" --generate-notes \
            --notes "安卓 App：下载 hgb-${{ steps.version.outputs.name }}.apk 安装（需要 Android 11 及以上）。.sha256 文件用来核对下载是否完整。"
